name: One-time Preview List Numbering and Table Guides

on:
  push:
    branches:
      - fix/preview-list-numbering-table-guides

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/preview-list-numbering-table-guides

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Repair one-shot patch quoting
        run: node scripts/fix-one-shot-preview-patch.cjs

      - name: Apply guarded patch
        run: node scripts/patch-preview-list-numbering-table-guides.cjs

      - name: Remove one-shot machinery
        run: |
          rm scripts/fix-one-shot-preview-patch.cjs
          rm scripts/patch-preview-list-numbering-table-guides.cjs
          rm .github/workflows/one-time-preview-list-numbering-table-guides.yml

      - name: Install dependencies
        run: npm ci

      - name: Test table regressions
        run: npm run test:tables

      - name: TypeScript verification
        run: npm run lint

      - name: Build web client
        run: npm run build:client

      - name: Verify clean diff
        run: git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Preview numbering around inserted tables and align table guides"
          git push origin HEAD:fix/preview-list-numbering-table-guides
