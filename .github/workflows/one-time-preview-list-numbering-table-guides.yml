name: One-time Preview List Numbering and Table Guides

on:
  push:
    branches:
      - fix/preview-list-numbering-table-guides

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/preview-list-numbering-table-guides

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Repair one-shot patch and tighten numbering bridge
        run: node scripts/fix-one-shot-preview-patch.cjs

      - name: Apply guarded source patch
        run: node scripts/patch-preview-list-numbering-table-guides.cjs

      - name: Remove one-shot machinery
        run: |
          rm scripts/fix-one-shot-preview-patch.cjs
          rm scripts/patch-preview-list-numbering-table-guides.cjs
          rm .github/workflows/one-time-preview-list-numbering-table-guides.yml

      - name: Install dependencies
        run: npm ci

      - name: Structured table pagination
        run: npx tsx --test tests/structured-table-pagination.test.ts

      - name: Table geometry resize
        run: npx tsx --test tests/table-geometry-resize.test.ts

      - name: Table pagination V2
        run: npx tsx --test tests/table-pagination-v2.test.ts

      - name: A4 table width contract
        run: npx tsx --test tests/a4-table-width-contract.test.ts

      - name: Live editor toolbar regressions
        run: npx tsx --test tests/live-editor-toolbar-regression.test.ts

      - name: Live SPO content integrity
        run: npx tsx --test tests/live-sop-content-integrity.test.ts

      - name: Table structural mutations
        run: npx tsx --test tests/table-structural-mutations.test.ts

      - name: Table interaction regressions
        run: npx tsx --test tests/table-interaction-regression.test.ts

      - name: Preview list numbering around inserted tables
        run: npx tsx --test tests/preview-list-numbering-table.test.ts

      - name: Full table gate
        run: npm run test:tables

      - name: TypeScript verification
        run: npm run lint

      - name: Build web client
        run: npm run build:client

      - name: Verify clean diff
        run: git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Preview numbering around inserted tables and align table guides"
          git push origin HEAD:fix/preview-list-numbering-table-guides
