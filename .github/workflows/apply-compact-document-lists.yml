name: Apply Compact Document Lists

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_compact_document_lists.py'
      - '.github/workflows/apply-compact-document-lists.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compact list patch
        run: python scripts/apply_compact_document_lists.py
      - name: Install dependencies
        run: npm ci
      - name: Verify client build
        run: npm run build:client
      - name: Commit compact list UI
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LibraryDocumentPage.tsx src/components/UserLibraryTab.tsx src/components/FinalLibraryPage.tsx
          git commit -m 'ui: unify compact document lists'
          git push origin main
