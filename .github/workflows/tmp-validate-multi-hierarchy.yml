name: Temporary Validate Multi Hierarchy Fix

on:
  push:
    branches:
      - fix/multi-hierarchy-user-assignments

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Multi-hierarchy behavior regression
        run: npx tsx --test tests/user-assignment-policy.test.ts
      - name: User-management source contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F "assignments.length <= 1 ? [draftAssignment]" src/components/UserManagementModal.tsx
          grep -F "mergeUserAssignments(assignments, draftAssignment)" src/components/UserManagementModal.tsx
          test "$(grep -c "setSelectedHierarchyOverride('');" src/components/UserManagementModal.tsx)" -ge 5
          grep -F "assignments: role === 'admin' ? [] : (Array.isArray(incoming.assignments) ? incoming.assignments : [])" functions/index.js
          grep -F "reconcileSopReadIndexForUser(userId, { ...allowedProfile, ...update }, true)" functions/index.js
      - name: Live pagination regression
        run: npm run test:live-pagination
      - name: Toolbar regression
        run: npx tsx --test tests/live-editor-toolbar-regression.test.ts
      - name: Structured table regression
        run: npm run test:tables
      - name: PDF binary regression
        run: npm run test:pdf-binary
      - name: Storage regression
        run: npm run test:storage
      - name: Revision regression
        run: npm run test:revision
      - name: SOP edit regression
        run: npm run test:sop-edit
      - name: SOP review regression
        run: npm run test:sop-review
      - name: Mail regression
        run: npm run test:mail
      - name: Numbering lifecycle regression
        run: npm run test:numbering-lifecycle
      - name: Functions verification
        run: npm run verify:functions
      - name: TypeScript gate
        run: npm run lint
      - name: Production build
        run: npm run build:client
