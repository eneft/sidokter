name: Verify SPO sync hierarchy fallback

on:
  push:
    branches:
      - fix/sync-blank-subhierarchy-fallback

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sync-blank-subhierarchy-fallback
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply sync patch
        run: node scripts/patch-sync-subhierarchy-fallback.cjs

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Test sync policy
        run: node --test functions/sopNumberSync.test.js

      - name: Run numbering boundary regression
        run: npm run test:sop-numbering-boundary

      - name: Build client
        run: npm run build:client

      - name: Check diff
        run: git diff --check

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/sopNumberSyncPolicy.js functions/sopNumberSync.test.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: align server SPO sync hierarchy resolution"
            git push origin HEAD:fix/sync-blank-subhierarchy-fallback
          fi
