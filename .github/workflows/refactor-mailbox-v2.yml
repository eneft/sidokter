name: Refactor Mailbox V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-mailbox-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply legacy review thread compatibility
        run: python3 scripts/fix-mailbox-thread-grouping.py

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Test mail architecture
        run: npm run test:mail

      - name: Build client
        run: npm run build:client

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NotificationModal.tsx
          git commit -m "fix: keep legacy review replies in one SPO thread"
          git push
