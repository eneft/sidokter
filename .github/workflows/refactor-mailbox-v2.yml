name: Refactor Mailbox V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-mailbox-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply mailbox refactor
        run: python3 scripts/refactor-mailbox-v2.py

      - name: Restore reply suggestion helper contract
        run: python3 scripts/fix-mailbox-v2-ui.py

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Verify functions
        run: npm run verify:functions

      - name: Test mail architecture
        run: npm run test:mail

      - name: Build client
        run: npm run build:client

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/notificationService.ts src/components/NotificationModal.tsx package.json functions/mailboxWorkflow.test.js tests/notification-architecture.test.cjs
          git commit -m "refactor: make SIDOKTER mailbox server authoritative"
          git push
