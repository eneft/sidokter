name: Temporary Toolbar Candidate 2
on:
  push:
    branches: [fix/live-spo-toolbar-command-bridge-v3]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/tmp-apply-toolbar-candidate2.py
      - name: Verify scope
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx tests/live-editor-toolbar-regression.test.ts)
          [[ "${changed[*]}" == "${expected[*]}" ]]
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx tests/live-editor-toolbar-regression.test.ts
          git commit -m "fix: keep Live SPO toolbar bound to active fragment"
          git push origin HEAD:fix/live-spo-toolbar-command-bridge-v3
