name: Apply REGULASI Patch Once

on:
  push:
    branches:
      - feature/regulasi-tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify REGULASI module
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/regulasi-tab
          fetch-depth: 0

      - name: Apply REGULASI patch
        run: python3 scripts/apply_regulasi_patch.py

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Verify Functions
        run: npm run verify:functions

      - name: Build web client
        run: npm run build:client

      - name: Validate diff
        run: git diff --check

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add REGULASI tab for PERDA and PERBUP"
          git push origin HEAD:feature/regulasi-tab
