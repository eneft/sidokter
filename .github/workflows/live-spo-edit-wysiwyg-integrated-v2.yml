name: Live SPO Edit WYSIWYG Integrated Verification v2

on:
  push:
    branches:
      - fix/live-spo-edit-wysiwyg-integrated

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply fail-closed integrated patch
        run: python3 .github/live-spo-integrated-patch.py

      - name: Diff sanity
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Toolbar regression
        run: npx tsx --test tests/live-editor-toolbar-regression.test.ts

      - name: Live pagination regression
        run: npm run test:live-pagination

      - name: Structured table suite
        run: npm run test:tables

      - name: Storage tests
        run: npm run test:storage

      - name: Revision tests
        run: npm run test:revision

      - name: SOP edit tests
        run: npm run test:sop-edit

      - name: SOP review tests
        run: npm run test:sop-review

      - name: Mail tests
        run: npm run test:mail

      - name: PDF binary tests
        run: npm run test:pdf-binary

      - name: Numbering lifecycle tests
        run: npm run test:numbering-lifecycle

      - name: Verify Firebase functions syntax/contracts
        run: npm run verify:functions

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified patch and clean temporary verification files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx src/utils/canonicalA4Pagination.ts src/components/SopDetailModal.tsx tests/live-editor-toolbar-regression.test.ts tests/live-sop-content-integrity.test.ts
          git commit -m "fix: stabilize Live SPO edit WYSIWYG and pagination"
          git rm .github/live-spo-integrated-patch.py .github/workflows/live-spo-edit-wysiwyg-integrated-v2.yml
          git commit -m "chore: remove temporary Live SPO verification files"
          git push origin HEAD:fix/live-spo-edit-wysiwyg-integrated
