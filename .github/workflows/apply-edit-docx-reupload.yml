name: Apply Edit DOCX Reupload Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply edit DOCX reupload patch
        id: patch
        run: |
          result=$(python scripts/apply-edit-docx-reupload.py)
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

      - name: Commit source patch
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EditSopModal.tsx tests/sop-mutation-regression.test.cjs
          git commit -m "feat: allow DOCX re-import while editing SPO body"
          git push origin HEAD:main
