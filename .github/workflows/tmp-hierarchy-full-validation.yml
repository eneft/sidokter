name: Temporary Full Hierarchy Validation

on:
  push:
    branches:
      - fix/generic-hierarchy-account-selector

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Hierarchy compatibility regression
        run: npx tsx --test tests/hierarchy-tree-compat.test.ts
      - name: Multi-hierarchy account regression
        run: npx tsx --test tests/user-assignment-policy.test.ts
      - name: Live pagination regression
        run: npm run test:live-pagination
      - name: Live toolbar regression
        run: npx tsx --test tests/live-editor-toolbar-regression.test.ts
      - name: Structured table regression
        run: npm run test:tables
      - name: PDF binary regression
        run: npm run test:pdf-binary
      - name: Storage regression
        run: npm run test:storage
      - name: Revision regression
        run: npm run test:revision
      - name: SOP edit regression
        run: npm run test:sop-edit
      - name: SOP review regression
        run: npm run test:sop-review
      - name: Internal mail regression
        run: npm run test:mail
      - name: Numbering lifecycle regression
        run: npm run test:numbering-lifecycle
      - name: Verify Firebase Functions
        run: npm run verify:functions
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
