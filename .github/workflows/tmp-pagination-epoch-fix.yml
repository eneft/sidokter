name: Temporary Pagination Epoch Candidate
on:
  push:
    branches: [fix/live-spo-toolbar-command-bridge-v3]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/tmp-pagination-epoch-fix.py
      - name: Verify scope
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx)
          [[ "${changed[*]}" == "${expected[*]}" ]]
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx
          git commit -m "fix: synchronize Live SPO fragments by pagination epoch"
          git push origin HEAD:fix/live-spo-toolbar-command-bridge-v3
