name: Apply Dokumen Digital Mobile Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-dokumen-digital.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply responsive mobile register layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/DashboardOverviewPage.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '{/* 3. Dokumen Digital Soegiri — embedded dashboard repository */}'
          before, sep, section = text.partition(marker)
          if not sep:
              raise SystemExit('Dokumen Digital section not found')
          section = sep + section

          replacements = [
              ('<div className="flex items-center gap-2 shrink-0">\n              <span className="text-[11px] font-bold text-slate-500">Tampilan:</span>', '<div className="hidden md:flex items-center gap-2 shrink-0">\n              <span className="text-[11px] font-bold text-slate-500">Tampilan:</span>'),
              ('<div className="flex items-center gap-2">\n              <div className="relative min-w-[200px] bg-slate-50/80 rounded-xl border border-slate-200 px-2.5 py-1 flex items-center">', '<div className="flex items-center gap-2 w-full md:w-auto">\n              <div className="relative w-full md:min-w-[200px] bg-slate-50/80 rounded-xl border border-slate-200 px-2.5 py-1 flex items-center">'),
              (") : archiveView === 'LIST' ? (\n          <div className=\"overflow-x-auto\">", ") : archiveView === 'LIST' ? (\n          <div className=\"overflow-hidden\">"),
              ('<div className="grid grid-cols-[44px_minmax(180px,1.6fr)_minmax(120px,1.15fr)_minmax(100px,0.8fr)_minmax(120px,1fr)_110px_110px] gap-3 px-5 py-3 bg-slate-50/70 border-b border-slate-100 text-[10px] font-black uppercase tracking-wide text-slate-500">', '<div className="hidden md:grid grid-cols-[44px_minmax(180px,1.6fr)_minmax(120px,1.15fr)_minmax(100px,0.8fr)_minmax(120px,1fr)_110px_110px] gap-3 px-5 py-3 bg-slate-50/70 border-b border-slate-100 text-[10px] font-black uppercase tracking-wide text-slate-500">'),
              ('className="grid grid-cols-[44px_minmax(180px,1.6fr)_minmax(120px,1.15fr)_minmax(100px,0.8fr)_minmax(120px,1fr)_110px_110px] gap-3 items-center px-5 py-3.5 border-b border-slate-100 last:border-b-0 hover:bg-slate-50/70"', 'className="grid grid-cols-[minmax(0,1fr)_auto] md:grid-cols-[44px_minmax(180px,1.6fr)_minmax(120px,1.15fr)_minmax(100px,0.8fr)_minmax(120px,1fr)_110px_110px] gap-x-3 gap-y-1.5 md:gap-3 items-center px-3.5 sm:px-4 md:px-5 py-3 md:py-3.5 border-b border-slate-100 last:border-b-0 hover:bg-slate-50/70 transition-colors"'),
              ('<span className="text-xs text-slate-400">{i + 1}</span>', '<span className="hidden md:block text-xs text-slate-400">{i + 1}</span>'),
              ('<div className="min-w-0">\n                    <div className="text-sm font-bold text-slate-900 truncate">{row.title}</div>', '<div className="order-3 col-span-2 md:order-none md:col-span-1 min-w-0">\n                    <div className="text-[13px] sm:text-sm font-bold text-slate-900 leading-snug md:truncate">{row.title}</div>'),
              ('<div className="text-[11px] text-slate-400 truncate flex items-center gap-1.5">', '<div className="mt-0.5 text-[10px] md:text-[11px] text-slate-400 min-w-0 flex items-center gap-1.5">'),
              ("<span>{row.fileName || 'Dokumen resmi'}{row.fileSize ? ` • ${formatBytes(row.fileSize)}` : ''}</span>", "<span className=\"truncate\">{row.fileName || 'Dokumen resmi'}{row.fileSize ? ` • ${formatBytes(row.fileSize)}` : ''}</span>"),
              ('className="inline-block px-1.5 py-0.2 rounded bg-slate-100 text-slate-700 font-mono text-[9px] font-bold border border-slate-200" title={`Sub-divisi: ${row.subCode}`}', 'className="shrink-0 inline-block px-1.5 py-0.2 rounded bg-slate-100 text-slate-700 font-mono text-[9px] font-bold border border-slate-200" title={`Sub-divisi: ${row.subCode}`}'),
              ('<span className="font-mono text-[11px] font-bold text-slate-700 truncate">{row.number || \'—\'}</span>', '<span className="order-1 md:order-none font-mono text-xs md:text-[11px] font-black md:font-bold text-slate-700 break-all md:truncate">{row.number || \'—\'}</span>'),
              ('className={`w-fit px-2 py-1 rounded-md text-[10px] font-black ${row.type === \'SPO\' ? \'bg-emerald-50 text-emerald-800\' : row.type === \'SK\' ? \'bg-teal-50 text-teal-800\' : \'bg-blue-50 text-blue-800\'}`}', 'className={`order-2 md:order-none justify-self-end md:justify-self-start w-fit px-2 py-0.5 md:py-1 rounded-full md:rounded-md text-[9px] md:text-[10px] font-black border md:border-0 ${row.type === \'SPO\' ? \'bg-emerald-50 text-emerald-800 border-emerald-200\' : row.type === \'SK\' ? \'bg-teal-50 text-teal-800 border-teal-200\' : \'bg-blue-50 text-blue-800 border-blue-200\'}`}'),
              ('<span className="text-[11px] font-semibold text-slate-600 truncate">{row.unit || \'RSUD Dr. Soegiri\'}</span>', '<span className="order-4 md:order-none text-[10px] md:text-[11px] font-semibold text-slate-600 truncate">{row.unit || \'RSUD Dr. Soegiri\'}</span>'),
              ('<span className="text-[11px] text-slate-500">{row.date ? new Date(row.date).toLocaleDateString(\'id-ID\', { day: \'2-digit\', month: \'short\', year: \'numeric\' }) : \'—\'}</span>', '<span className="order-5 md:order-none justify-self-end md:justify-self-start text-[10px] md:text-[11px] text-slate-400 md:text-slate-500 whitespace-nowrap">{row.date ? new Date(row.date).toLocaleDateString(\'id-ID\', { day: \'2-digit\', month: \'short\', year: \'numeric\' }) : \'—\'}</span>'),
              ('<div className="flex justify-end gap-1.5"><button type="button" onClick={() => handleArchiveOpen(row)}', '<div className="order-6 col-span-2 md:order-none md:col-span-1 flex justify-end gap-1.5 mt-1 md:mt-0"><button type="button" onClick={() => handleArchiveOpen(row)}'),
          ]

          for old, new in replacements:
              if old not in section:
                  raise SystemExit(f'Expected mobile layout anchor not found: {old[:90]}')
              section = section.replace(old, new, 1)

          required = [
              'hidden md:grid grid-cols-[44px_minmax(180px,1.6fr)',
              'grid-cols-[minmax(0,1fr)_auto] md:grid-cols-[44px_minmax(180px,1.6fr)',
              'order-1 md:order-none font-mono text-xs',
              'hidden md:flex items-center gap-2 shrink-0',
          ]
          for expected in required:
              if expected not in section:
                  raise SystemExit(f'Mobile layout marker missing: {expected}')

          path.write_text(before + section, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify client build
        run: npm run build:client

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-mobile-dokumen-digital.yml
          git add src/components/DashboardOverviewPage.tsx
          git commit -m 'ui: align Dokumen Digital mobile list with SPO and SK'
          git push origin main
