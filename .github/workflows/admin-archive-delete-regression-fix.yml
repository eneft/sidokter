name: Fix Admin Archive Delete Regression Contract

on:
  push:
    branches:
      - fix/admin-delete-archived-sop-20260925
    paths:
      - '.github/workflows/admin-archive-delete-regression-fix.yml'
      - 'scripts/fix-sop-delete-admin-invariant.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-delete-archived-sop-20260925

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preserve explicit ever-active Admin guard
        run: python scripts/fix-sop-delete-admin-invariant.py

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Verify functions
        run: npm run verify:functions

      - name: Verify SPO edit/delete and numbering boundaries
        shell: bash
        run: |
          npm run test:sop-edit
          npm run test:numbering-lifecycle
          node --test tests/sop-mutation-regression.test.cjs

      - name: Verify tables and A4
        run: npm run test:tables

      - name: Build web client
        run: npm run build:client

      - name: Commit verified regression fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admin-archive-delete-regression-fix.yml scripts/fix-sop-delete-admin-invariant.py
          git add functions/index.js
          git commit -m 'fix: preserve trusted SPO delete admin invariant'
          git push origin HEAD:fix/admin-delete-archived-sop-20260925
