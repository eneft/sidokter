name: Temporary Hierarchy Selector Audit

on:
  push:
    branches:
      - fix/generic-hierarchy-account-selector

jobs:
  hierarchy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce hierarchy selector bug
        run: npx tsx --test tests/hierarchy-tree-compat.test.ts
