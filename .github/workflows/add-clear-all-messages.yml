name: Add Clear All Messages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-clear-all-messages.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Patch clear-all mailbox behavior
        run: python3 scripts/add-clear-all-messages.py

      - name: Install dependencies
        run: npm ci

      - name: Verify mail tests
        run: npm run test:mail

      - name: Verify client build
        run: npm run build:client

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/notificationService.ts src/components/NotificationModal.tsx
          git commit -m "feat: add clear all messages control"
          git push
