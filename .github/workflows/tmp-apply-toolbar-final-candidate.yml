name: Temporary Apply Proven Toolbar Candidate

on:
  push:
    branches:
      - fix/live-spo-toolbar-command-bridge-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply proven candidate
        run: python3 scripts/tmp-apply-toolbar-final-candidate-v2.py
      - name: Verify exact source scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx tests/live-editor-toolbar-regression.test.ts)
          [[ "${changed[*]}" == "${expected[*]}" ]]
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RichTextEditor.tsx src/components/SopLiveTemplate.tsx tests/live-editor-toolbar-regression.test.ts
          git commit -m "fix: preserve Live SPO toolbar state across pagination"
          git push origin HEAD:fix/live-spo-toolbar-command-bridge-v3
