name: Temporary Apply Hierarchy Selector Fix

on:
  push:
    branches:
      - fix/generic-hierarchy-account-selector

permissions:
  contents: write

jobs:
  apply-candidate:
    if: contains(github.event.head_commit.message, 'trigger guarded hierarchy fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply exact candidate patch
        run: python .github/tmp/apply-hierarchy-selector-fix.py
      - name: Guard candidate scope
        shell: bash
        run: |
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/components/MasterDataModal.tsx' \
            'src/components/UserManagementModal.tsx' \
            'src/utils/hierarchyTree.ts' | sort)"
          echo "Changed files:"
          echo "$actual"
          test "$actual" = "$expected"
      - name: Prove regression is fixed
        run: npx tsx --test tests/hierarchy-tree-compat.test.ts
      - name: TypeScript gate
        run: npm run lint
      - name: Commit candidate only after green gates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/hierarchyTree.ts src/components/UserManagementModal.tsx src/components/MasterDataModal.tsx
          git commit -m 'fix: use generic hierarchy tree for account access'
          git push origin HEAD:fix/generic-hierarchy-account-selector
