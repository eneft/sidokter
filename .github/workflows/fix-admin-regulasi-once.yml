name: Fix Admin Regulasi Nav Once

on:
  push:
    branches:
      - fix/admin-regulasi-nav3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-regulasi-nav3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Patch admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Header.tsx')
          s = p.read_text()
          old = """    { id: 'mou', label: 'MOU', icon: Handshake, count: mouCount },\n    { id: 'admin', label: 'Administrator', icon: ShieldCheck },"""
          new = """    { id: 'mou', label: 'MOU', icon: Handshake, count: mouCount },\n    { id: 'regulasi', label: 'Regulasi', icon: BookOpen },\n    { id: 'admin', label: 'Administrator', icon: ShieldCheck },"""
          if old not in s:
              raise SystemExit('Target adminItems block not found or already patched')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build:client
      - name: Validate diff
        run: |
          git diff --check
          git diff -- src/components/Header.tsx
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-admin-regulasi-once.yml
          git add src/components/Header.tsx
          git commit -m "fix: show REGULASI in admin navigation"
          git push origin HEAD:fix/admin-regulasi-nav3
