name: One-time restore login wordmark

on:
  push:
    branches:
      - fix/restore-login-wordmark

permissions:
  contents: write

jobs:
  restore-login-wordmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-login-wordmark
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded rollback
        run: python scripts/one-time-restore-login-wordmark.py

      - name: Install dependencies
        run: npm ci

      - name: Build web client
        run: npm run build:client

      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Restore legacy SIDOKTER login wordmark"
            git push origin HEAD:fix/restore-login-wordmark
          fi
