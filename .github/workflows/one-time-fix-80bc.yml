name: One-time 80bc repair

on:
  push:
    branches:
      - fix/80bcf8a-ci-security-regressions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/80bcf8a-ci-security-regressions
          fetch-depth: 0

      - name: Apply guarded source repair
        run: python .github/scripts/fix80bc.py

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "Source already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js src/lib/firestoreService.ts
          git commit -m "Fix SPO mutation runtime and ownership boundaries"
          git push origin HEAD:fix/80bcf8a-ci-security-regressions
