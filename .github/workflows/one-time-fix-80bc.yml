name: One-time 80bc repair

on:
  push:
    branches:
      - fix/80bcf8a-ci-security-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/80bcf8a-ci-security-regressions
          fetch-depth: 0

      - name: Apply exact guarded patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          index_old = """          const snapshot = await transaction.get(sopRef);
          let stored;
          if (!snapshot.exists) {
            const userUid = String(context.user?.id || context.user?.authUid || '').trim();
            const baseKeys = getSopAccessKeysServer(submitted);
            stored = {
              id: sopId,
              status: 'DRAFT',
              title: String(submitted.title || 'Draft SPO').trim(),
              createdAt: new Date().toISOString(),
              createdBy: context.user?.username || 'user',
              accessKeys: baseKeys,
              authorizedUids: userUid ? [userUid] : [],
              ...submitted,
            };
          } else {
            const storedRaw = { id: snapshot.id, ...snapshot.data() };
            stored = {
              ...storedRaw,
              accessKeys: Array.isArray(storedRaw.accessKeys) && storedRaw.accessKeys.length
                ? storedRaw.accessKeys
                : getSopAccessKeysServer(storedRaw),
            };
          }
"""
          index_new = """          const snapshot = await transaction.get(sopRef);
          let storedRaw;
          let stored;
          if (!snapshot.exists) {
            const userUid = String(context.decoded?.uid || context.user?.id || context.user?.authUid || '').trim();
            const baseKeys = getSopAccessKeysServer(submitted);
            storedRaw = {
              ...submitted,
              id: sopId,
              status: 'DRAFT',
              title: String(submitted.title || 'Draft SPO').trim(),
              createdAt: submitted.createdAt || new Date().toISOString(),
              createdBy: context.user?.username || 'user',
              creatorUid: userUid,
              accessKeys: baseKeys,
              authorizedUids: userUid ? [userUid] : [],
            };
            stored = storedRaw;
          } else {
            storedRaw = { id: snapshot.id, ...snapshot.data() };
            stored = {
              ...storedRaw,
              accessKeys: Array.isArray(storedRaw.accessKeys) && storedRaw.accessKeys.length
                ? storedRaw.accessKeys
                : getSopAccessKeysServer(storedRaw),
            };
          }
"""
          replace_once('functions/index.js', index_old, index_new, 'sop-edit storedRaw scope')

          delete_old = """          const stored = { id: snapshot.id, ...snapshot.data() };
          const isAdmin = context.user?.role === 'admin';
          const userUid = String(context.user?.id || context.user?.authUid || context.decoded?.uid || '').trim();
          const isCreator = stored.createdBy === context.user?.username || (Array.isArray(stored.authorizedUids) && stored.authorizedUids.includes(userUid));

          if (!isAdmin && !isCreator) {
            const error = new Error('PERMISSION_DENIED');
            error.sopDeleteStatus = 403;
            error.sopDeleteCode = 'PERMISSION_DENIED';
            error.sopDeleteMessage = 'Anda tidak memiliki hak akses untuk menghapus dokumen SPO ini.';
            throw error;
          }

          const wasEverActive = stored.everActivated === true || stored.status === 'AKTIF' || stored.status === 'DIARSIPKAN' || Boolean(stored.activatedAt);
"""
          delete_new = """          const stored = { id: snapshot.id, ...snapshot.data() };
          const isAdmin = normalizeRole(context.user?.role) === 'admin';
          const userUid = String(context.decoded?.uid || context.user?.id || context.user?.authUid || '').trim();
          const actorUsername = normalizeUsername(context.user?.username);
          const creatorUid = String(stored.creatorUid || '').trim();
          const createdBy = normalizeUsername(stored.createdBy);
          const isCreator = Boolean(
            (creatorUid && userUid && creatorUid === userUid) ||
            (createdBy && actorUsername && createdBy === actorUsername)
          );

          const wasEverActive = stored.everActivated === true || stored.status === 'AKTIF' || stored.status === 'DIARSIPKAN' || Boolean(stored.activatedAt);

          if (wasEverActive && !isAdmin) {
            const error = new Error('PERMISSION_DENIED');
            error.sopDeleteStatus = 403;
            error.sopDeleteCode = 'PERMISSION_DENIED';
            error.sopDeleteMessage = 'SPO yang pernah aktif hanya dapat diarsipkan oleh Administrator.';
            throw error;
          }

          if (!wasEverActive && !isAdmin && !isCreator) {
            const error = new Error('PERMISSION_DENIED');
            error.sopDeleteStatus = 403;
            error.sopDeleteCode = 'PERMISSION_DENIED';
            error.sopDeleteMessage = 'Anda hanya dapat menghapus permanen DRAFT yang Anda buat sendiri.';
            throw error;
          }
"""
          replace_once('functions/index.js', delete_old, delete_new, 'sop-delete ownership')

          clean_old = """    const cleanSop = sanitizeForFirestore({
      ...sop,
      ...(sop.status === 'AKTIF' || sop.status === 'DIARSIPKAN' || sop.everActivated ? { everActivated: true } : {}),
"""
          clean_new = """    const cleanSop = sanitizeForFirestore({
      ...sop,
      creatorUid: (sop as any).creatorUid || currentUid || undefined,
      createdBy: (sop as any).createdBy || currentSessionRaw?.username || 'user',
      ...(sop.status === 'AKTIF' || sop.status === 'DIARSIPKAN' || sop.everActivated ? { everActivated: true } : {}),
"""
          replace_once('src/lib/firestoreService.ts', clean_old, clean_new, 'new SPO creator identity')

          draft_old = """          createdAt: cleanSop.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          authorizedUids: authorizedUids.length ? authorizedUids : (currentUid ? [currentUid] : []),
"""
          draft_new = """          createdAt: cleanSop.createdAt || new Date().toISOString(),
          creatorUid: currentUid || undefined,
          createdBy: currentSessionRaw?.username || 'user',
          updatedAt: new Date().toISOString(),
          authorizedUids: authorizedUids.length ? authorizedUids : (currentUid ? [currentUid] : []),
"""
          replace_once('src/lib/firestoreService.ts', draft_old, draft_new, 'initial DRAFT creator identity')

          workflow_old = """      - name: Test Hierarchy Cloud Boundary
        run: npm run test:hierarchy

      - name: Test Tables
"""
          workflow_new = """      - name: Test Hierarchy Cloud Boundary
        run: npm run test:hierarchy

      - name: Test SPO Edit & Mutation Boundary
        run: |
          npm run test:sop-edit
          node --test tests/sop-mutation-regression.test.cjs

      - name: Test Tables
"""
          replace_once('.github/workflows/firebase-deploy.yml', workflow_old, workflow_new, 'CI mutation tests')

          Path('tests/sop-mutation-regression.test.cjs').write_text(r'''\
'use strict';

const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');

const indexSource = fs.readFileSync('functions/index.js', 'utf8');
const rulesSource = fs.readFileSync('firestore.rules', 'utf8');
const mainSource = fs.readFileSync('src/main.tsx', 'utf8');

test('trusted sop-edit keeps storedRaw in transaction scope', () => {
  const blockStart = indexSource.indexOf("if (action === 'sop-edit')");
  const blockEnd = indexSource.indexOf("if (action === 'sop-delete')");
  assert.ok(blockStart >= 0 && blockEnd > blockStart, 'sop-edit block must exist');
  const block = indexSource.slice(blockStart, blockEnd);
  assert.match(block, /let storedRaw;/);
  assert.match(block, /storedRaw = \{ id: snapshot\.id, \.\.\.snapshot\.data\(\) \};/);
  assert.doesNotMatch(block, /const storedRaw = \{ id: snapshot\.id/);
  assert.match(block, /resultingSop = \{ \.\.\.storedRaw, \.\.\.next \};/);
});

test('SPO delete uses creator identity, not hierarchy read authorization', () => {
  const blockStart = indexSource.indexOf("if (action === 'sop-delete')");
  const blockEnd = indexSource.indexOf("if (action === 'migrate-sop-access')");
  assert.ok(blockStart >= 0 && blockEnd > blockStart, 'sop-delete block must exist');
  const block = indexSource.slice(blockStart, blockEnd);
  assert.match(block, /creatorUid && userUid && creatorUid === userUid/);
  assert.match(block, /createdBy && actorUsername && createdBy === actorUsername/);
  assert.doesNotMatch(block, /authorizedUids[^\n]*includes\(userUid\)/);
  assert.match(block, /wasEverActive && !isAdmin/);
});

test('privileged numbering writes remain fail-closed in Firestore Rules', () => {
  assert.match(rulesSource, /match \/system_config\/\{configId\}[\s\S]*?allow write: if isAdmin\(\);/);
  assert.doesNotMatch(rulesSource, /configId\.matches\('\^spo_sequence_/);
  assert.match(rulesSource, /match \/sop_number_reservations\/\{reservationId\}[\s\S]*?allow delete: if isAdmin\(\);/);
});

test('Firebase Auth is restored before React mounts', () => {
  assert.match(mainSource, /restoreFirebaseAuthBeforeRender/);
  assert.match(mainSource, /await refreshUserSessionProfile\(persistedSession\)/);
});
''')
          PY

      - name: Commit guarded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js src/lib/firestoreService.ts .github/workflows/firebase-deploy.yml tests/sop-mutation-regression.test.cjs
          git commit -m "Fix SPO mutation runtime and ownership boundaries"
          git push origin HEAD:fix/80bcf8a-ci-security-regressions
