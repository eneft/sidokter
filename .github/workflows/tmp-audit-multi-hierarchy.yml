name: Temporary Multi Hierarchy Audit

on:
  push:
    branches:
      - fix/multi-hierarchy-user-assignments

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce hierarchy replacement bug
        run: npx tsx scripts/tmp-multi-hierarchy-audit.ts
