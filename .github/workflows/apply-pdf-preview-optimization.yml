name: Apply PDF Preview Optimization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-pdf-preview-optimization.cjs'
      - '.github/workflows/apply-pdf-preview-optimization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-pdf-preview-optimization.cjs')
          s = p.read_text()
          s = s.replace('\\\\`', '\\`').replace('\\\\${', '\\${')
          s = s.replace("if (count !== 1) throw new Error(`${label}: expected exactly 1 match, found ${count}`);", "if (count < 1) throw new Error(`${label}: expected at least 1 match, found ${count}`);")
          p.write_text(s)
          PY
      - name: Apply patch
        run: node scripts/apply-pdf-preview-optimization.cjs
      - name: Verify syntax and targeted tests
        run: |
          node --check functions/index.js
          node --check functions/pdfPreviewOptimizer.js
          node --test functions/pdfPreviewOptimizer.test.js
          npm run build:client
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js functions/storageRouting.js functions/pdfPreviewOptimizer.js functions/pdfPreviewOptimizer.test.js src/components/DocumentViewer.tsx
          git commit -m 'perf: optimize protected PDF previews'
          git push origin main
