name: iOS Stage 6 Simulator Regression

on:
  push:
    branches:
      - ios/tahap-6-device-regression
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-stage6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-regression:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native and business boundaries
        run: |
          npm run lint
          npm run verify:functions
          npm run test:revision
          npm run test:hierarchy
          npm run test:sop-edit
          npm run test:pdf-binary

      - name: Build and sync iOS
        run: |
          npm run build:client
          npx cap sync ios

      - name: Compile simulator app
        run: |
          rm -rf .derivedData
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$PWD/.derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); candidates=[]; [candidates.extend(v) for v in d.get("devices",{}).values()]; phones=[x for x in candidates if "iPhone" in x.get("name","") and x.get("isAvailable",False)]; print(phones[0]["udid"] if phones else "")')"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          python3 - "$UDID" <<'PY'
          import json, subprocess, sys, time
          udid = sys.argv[1]
          for _ in range(90):
              raw = subprocess.check_output(['xcrun','simctl','list','devices','-j'], text=True)
              data = json.loads(raw)
              states = [d.get('state') for devices in data.get('devices',{}).values() for d in devices if d.get('udid') == udid]
              if 'Booted' in states:
                  print('Simulator booted:', udid)
                  time.sleep(8)
                  raise SystemExit(0)
              time.sleep(1)
          raise SystemExit('Simulator did not reach Booted state within 90 seconds')
          PY

      - name: Install and launch SIDOKTER
        shell: bash
        run: |
          set -euo pipefail
          export UDID='${{ steps.simulator.outputs.udid }}'
          export BUNDLE='id.go.lamongankab.rsudsoegiri.sidokter'
          export APP_PATH="$(find "$PWD/.derivedData/Build/Products/Debug-iphonesimulator" -maxdepth 2 -name 'App.app' -print -quit)"
          test -d "$APP_PATH"
          mkdir -p artifacts
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | tee artifacts/bundle-id.txt
          python3 <<'PY'
          import os, subprocess, time, traceback
          udid, bundle, app = os.environ['UDID'], os.environ['BUNDLE'], os.environ['APP_PATH']
          diag = []
          def record(label, value):
              text = f'\n=== {label} ===\n{value}\n'
              diag.append(text)
              print(text)
          try:
              installed = False
              for attempt in range(1, 4):
                  try:
                      result = subprocess.run(['xcrun','simctl','install',udid,app], text=True, capture_output=True, timeout=45)
                      record(f'install attempt {attempt} rc={result.returncode}', (result.stdout or '') + '\n' + (result.stderr or ''))
                      if result.returncode == 0:
                          installed = True
                          break
                  except Exception as exc:
                      record(f'install attempt {attempt} exception', repr(exc))
                  time.sleep(8)
              if not installed:
                  raise RuntimeError('simctl install failed after 3 attempts')

              apps = subprocess.run(['xcrun','simctl','listapps',udid], text=True, capture_output=True, timeout=25)
              record('listapps', (apps.stdout or '') + '\n' + (apps.stderr or ''))
              if bundle not in (apps.stdout or ''):
                  raise RuntimeError(f'Expected bundle {bundle} not present after install')

              launched = subprocess.run(['xcrun','simctl','launch','--terminate-running-process',udid,bundle], text=True, capture_output=True, timeout=30)
              record(f'launch rc={launched.returncode}', (launched.stdout or '') + '\n' + (launched.stderr or ''))
              if launched.returncode != 0:
                  raise RuntimeError('simctl launch failed')
              time.sleep(8)

              container = subprocess.check_output(['xcrun','simctl','get_app_container',udid,bundle,'app'], text=True, timeout=20).strip()
              record('app container', container)
              if not os.path.isdir(container):
                  raise RuntimeError('Installed app container not found')

              try:
                  subprocess.run(['xcrun','simctl','io',udid,'screenshot','artifacts/launch.png'], check=True, timeout=15)
              except Exception as exc:
                  record('screenshot notice', repr(exc))
          except Exception as exc:
              record('failure', repr(exc) + '\n' + traceback.format_exc())
              for command, label in [
                  (['xcrun','simctl','listapps',udid], 'listapps after failure'),
                  (['xcrun','simctl','list','devices'], 'devices after failure'),
                  (['xcrun','simctl','spawn',udid,'log','show','--style','compact','--last','3m','--predicate',f'eventMessage CONTAINS[c] "{bundle}" OR process == "installd" OR process == "SpringBoard"'], 'simulator log')
              ]:
                  try:
                      r = subprocess.run(command, text=True, capture_output=True, timeout=30)
                      record(label, (r.stdout or '') + '\n' + (r.stderr or ''))
                  except Exception as inner:
                      record(label + ' diagnostic exception', repr(inner))
              raise
          finally:
              with open('artifacts/install-diagnostic.txt','w',encoding='utf-8') as handle:
                  handle.write(''.join(diag))
          PY

      - name: Lifecycle relaunch smoke
        shell: bash
        run: |
          set -euo pipefail
          export UDID='${{ steps.simulator.outputs.udid }}'
          export BUNDLE='id.go.lamongankab.rsudsoegiri.sidokter'
          python3 <<'PY'
          import os, subprocess, time
          udid, bundle = os.environ['UDID'], os.environ['BUNDLE']
          subprocess.run(['xcrun','simctl','terminate',udid,bundle], check=False, timeout=20)
          time.sleep(2)
          out = subprocess.run(['xcrun','simctl','launch',udid,bundle], check=True, text=True, capture_output=True, timeout=30)
          print(out.stdout.strip())
          time.sleep(6)
          subprocess.check_output(['xcrun','simctl','get_app_container',udid,bundle,'app'], text=True, timeout=20)
          try:
              subprocess.run(['xcrun','simctl','io',udid,'screenshot','artifacts/relaunch.png'], check=True, timeout=15)
          except Exception as exc:
              print('Relaunch screenshot evidence unavailable:', exc)
          PY

      - name: Verify native integration contract
        run: npx tsx tests/ios-native-ux-contract.test.ts

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-stage6-simulator-evidence
          path: artifacts/
          if-no-files-found: warn
