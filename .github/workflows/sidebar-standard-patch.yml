name: Apply desktop sidebar standardization

on:
  push:
    branches:
      - fix/desktop-sidebar-standard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch desktop sidebar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Header.tsx')
          text = path.read_text(encoding='utf-8')

          old_brand = '<div className="text-[11px] text-emerald-700 font-bold truncate">RSUD Dr. Soegiri Lamongan</div>'
          new_brand = '<div className="text-[10px] text-emerald-700 font-bold leading-tight">RSUD Dr. Soegiri Lamongan - Bagian Umum dan Kepegawaian</div>'
          brand_count = text.count(old_brand)
          if brand_count != 2:
              raise SystemExit(f'Expected 2 desktop brand subtitles, found {brand_count}')
          text = text.replace(old_brand, new_brand)

          user_close = '''        </aside>\n\n        <DesktopAccountHeader'''
          user_version = '''          <div className="px-3.5 pb-3 text-center text-[9px] font-black tracking-[0.14em] text-slate-400">\n            SIDOKTER V. 1.0.0\n          </div>\n        </aside>\n\n        <DesktopAccountHeader'''
          if text.count(user_close) != 1:
              raise SystemExit(f'Expected one user desktop sidebar closing marker, found {text.count(user_close)}')
          text = text.replace(user_close, user_version, 1)

          admin_close = '''      </aside>\n\n      <DesktopAccountHeader'''
          admin_version = '''        <div className="px-3.5 pb-3 text-center text-[9px] font-black tracking-[0.14em] text-slate-400">\n          SIDOKTER V. 1.0.0\n        </div>\n      </aside>\n\n      <DesktopAccountHeader'''
          if text.count(admin_close) != 1:
              raise SystemExit(f'Expected one admin desktop sidebar closing marker, found {text.count(admin_close)}')
          text = text.replace(admin_close, admin_version, 1)

          if 'Terakreditasi Paripurna' in text:
              raise SystemExit('Legacy accreditation badge is still present in Header.tsx')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify client build
        run: |
          npm ci
          npm run build:client
          git diff --check
          test "$(grep -F -c 'RSUD Dr. Soegiri Lamongan - Bagian Umum dan Kepegawaian' src/components/Header.tsx)" -eq 2
          test "$(grep -F -c 'SIDOKTER V. 1.0.0' src/components/Header.tsx)" -eq 2
          ! grep -F "Terakreditasi Paripurna" src/components/Header.tsx

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/sidebar-standard-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx .github/workflows/sidebar-standard-patch.yml
          git commit -m "fix: standardize desktop sidebar identity"
          git push origin HEAD:fix/desktop-sidebar-standard
