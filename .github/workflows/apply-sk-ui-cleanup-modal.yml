name: Apply SK Modal Cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply SK modal cleanup
        id: patch
        run: |
          result=$(python scripts/apply-sk-ui-cleanup-modal.py)
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

      - name: Commit source patch
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LibraryDocumentPage.tsx
          git commit -m "refactor: simplify SK upload form"
          git push origin HEAD:main
