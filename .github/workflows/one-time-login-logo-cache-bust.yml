name: One-time login logo cache-bust

on:
  push:
    branches:
      - fix/login-logo-rendering

permissions:
  contents: write

jobs:
  patch-logo-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/login-logo-rendering
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded cache-bust patch
        run: python scripts/one-time-login-logo-cache-bust.py
      - name: Verify v2 logo source asset
        run: |
          set -euxo pipefail
          test -s public/sidokter-logo-v2.webp
          cmp public/sidokter-logo.webp public/sidokter-logo-v2.webp
          grep -q 'sidokter-logo-v2.webp?v=20260923-0619' src/components/LoginPage.tsx
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build:client
      - name: Verify built v2 asset
        run: |
          set -euxo pipefail
          test -s dist/sidokter-logo-v2.webp
          cmp public/sidokter-logo-v2.webp dist/sidokter-logo-v2.webp
      - name: Verify local serving and MIME
        run: |
          set -euxo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsSI 'http://127.0.0.1:4173/sidokter-logo-v2.webp?v=20260923-0619' | tee /tmp/logo-v2-headers.txt
          grep -qi 'content-type: image/webp' /tmp/logo-v2-headers.txt
          curl -fsS 'http://127.0.0.1:4173/sidokter-logo-v2.webp?v=20260923-0619' -o /tmp/served-logo-v2.webp
          cmp dist/sidokter-logo-v2.webp /tmp/served-logo-v2.webp
      - name: Commit patched login
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Use cache-busted SIDOKTER login logo asset"
            git push origin HEAD:fix/login-logo-rendering
          fi
