name: Fix Mobile A4 Pagination Overflow

on:
  push:
    branches:
      - fix/mobile-a4-pagination-overflow
    paths:
      - '.github/workflows/fix-mobile-a4-pagination-overflow.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mobile-a4-pagination-overflow

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply permanent mobile A4 pagination fix
        run: python scripts/apply-mobile-a4-pagination-overflow-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused pagination regression test
        run: node --test tests/sop-preview-mobile-pagination.test.cjs

      - name: Verify client build
        run: npm run build:client

      - name: Commit verified fix and remove temporary patch files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-mobile-a4-pagination-overflow.yml
          git rm scripts/apply-mobile-a4-pagination-overflow-fix.py
          git add src/components/SopDetailModal.tsx tests/sop-preview-mobile-pagination.test.cjs
          git commit -m 'fix: make mobile A4 preview pagination scale-invariant'
          git push origin fix/mobile-a4-pagination-overflow
