name: Temporary Firestore Permission Audit

on:
  push:
    branches:
      - fix/firestore-permission-deploy-gap

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce production permission deploy gap
        run: npx tsx --test tests/firestore-permission-deploy-contract.test.ts
