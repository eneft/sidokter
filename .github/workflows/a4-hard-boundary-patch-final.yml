name: Final A4 Hard Boundary Patch

on:
  push:
    branches:
      - fix/a4-hard-boundary-20260925
    paths:
      - '.github/workflows/a4-hard-boundary-patch-final.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/a4-hard-boundary-20260925

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply A4 hard-boundary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('src/index.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = """/* Eradicate any accidental nested scrollbars, clipping, or height caps inside official SOP documents */
          .sop-batang-tubuh-content,
          .sop-batang-tubuh-content *,
          .rich-text-output,
          .rich-text-output *,
          .rich-text-document-content,
          .rich-text-document-content *,
          #printable-sop-official-document,
          #printable-sop-official-document * {
            overflow: visible !important;
            max-height: none !important;
          }
          """
          # YAML removes the common run-block indent, but Python string contents
          # retain the indentation shown above. Normalize only this literal.
          old_css = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_css.splitlines()) + '\n'
          new_css = """/* Rich text may flow naturally inside its table cell, but the physical A4
          sheet itself must remain the final paint/height boundary. Never apply the
          old #printable-sop-official-document * overflow override to page shells. */
          .sop-batang-tubuh-content,
          .sop-batang-tubuh-content *,
          .rich-text-output,
          .rich-text-output *,
          .rich-text-document-content,
          .rich-text-document-content * {
            overflow: visible !important;
            max-height: none !important;
          }

          /* HARD A4 BOUNDARY CONTRACT — desktop, mobile Safari, print and PDF.
             Pagination owns page membership; the physical sheet is the final paint
             guard, including transformed/absolute media imported from DOCX. */
          #printable-sop-official-document .sop-preview-page,
          #printable-sop-official-document.pdf-export-document .sop-preview-page,
          .sop-live-a4-page,
          .sop-measure-root [data-measure-page] {
            overflow: hidden !important;
            max-height: 297mm !important;
            box-sizing: border-box !important;
            contain: paint;
            isolation: isolate;
          }

          #printable-sop-official-document .sop-preview-page > .sop-a4-content-frame,
          .sop-live-a4-page > .sop-a4-content-frame {
            height: 100% !important;
            max-height: 100% !important;
            min-height: 0 !important;
            box-sizing: border-box !important;
          }

          [data-sop-page-fit-block="true"] {
            overflow: hidden !important;
            contain: paint;
            max-width: 100% !important;
          }
          """
          new_css = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_css.splitlines()) + '\n'
          if old_css not in css:
              raise SystemExit('Broad printable overflow rule not found')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')

          pag_path = Path('src/utils/canonicalA4Pagination.ts')
          pag = pag_path.read_text(encoding='utf-8')

          constants = "const OFFICIAL_CELL_HORIZONTAL_BORDER_PX = 2;\n"
          if constants not in pag:
              raise SystemExit('Paginator constants anchor not found')
          pag = pag.replace(constants, constants + "export const MIN_A4_SAFETY_BUFFER_PX = 8;\nconst OFFICIAL_BODY_FONT_PX = 12 * (96 / 72);\nconst OFFICIAL_SECTION_LABEL_LINE_HEIGHT_PX = OFFICIAL_BODY_FONT_PX * 1.4;\n", 1)

          row_anchor = """export function getCanonicalSectionRowChromePx(): number {
            return SOP_SECTION_CELL_PADDING_MM * 2 * CSS_PX_PER_MM + 1;
          }
          """
          row_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in row_anchor.splitlines()) + '\n'
          label_helper = """
          /** Minimum text height of the official left-hand section label. */
          export function getCanonicalSectionLabelMinimumHeightPx(section: OfficialSectionKey): number {
            const lineCount = section === 'ALUR / BAGAN ALIR' || section === 'UNIT TERKAIT' ? 2 : 1;
            return Math.ceil(lineCount * OFFICIAL_SECTION_LABEL_LINE_HEIGHT_PX);
          }
          """
          label_helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in label_helper.splitlines()) + '\n'
          if row_anchor not in pag:
              raise SystemExit('Section row chrome anchor not found')
          pag = pag.replace(row_anchor, row_anchor + label_helper, 1)

          flow_pattern = re.compile(r"export function sectionFlowContributionPx\(\n  previousRawHeightPx: number,\n  nextRawHeightPx: number,\n  startsNewSectionFragment: boolean\n\): number \{\n  const previous = Number\.isFinite\(previousRawHeightPx\) \? Math\.max\(0, previousRawHeightPx\) : 0;\n  const next = Number\.isFinite\(nextRawHeightPx\) \? Math\.max\(0, nextRawHeightPx\) : 0;\n  if \(startsNewSectionFragment\) \{\n    return Math\.max\(LIVE_SOP_SECTION_MIN_HEIGHT_PX, next\);\n  \}\n  const before = Math\.max\(LIVE_SOP_SECTION_MIN_HEIGHT_PX, previous\);\n  const after = Math\.max\(LIVE_SOP_SECTION_MIN_HEIGHT_PX, previous \+ next\);\n  return Math\.max\(0, after - before\);\n\}")
          flow_replacement = """export function sectionFlowContributionPx(
            previousRawHeightPx: number,
            nextRawHeightPx: number,
            startsNewSectionFragment: boolean,
            minimumContentHeightPx: number = LIVE_SOP_SECTION_MIN_HEIGHT_PX
          ): number {
            const previous = Number.isFinite(previousRawHeightPx) ? Math.max(0, previousRawHeightPx) : 0;
            const next = Number.isFinite(nextRawHeightPx) ? Math.max(0, nextRawHeightPx) : 0;
            const floor = Number.isFinite(minimumContentHeightPx)
              ? Math.max(LIVE_SOP_SECTION_MIN_HEIGHT_PX, minimumContentHeightPx)
              : LIVE_SOP_SECTION_MIN_HEIGHT_PX;
            if (startsNewSectionFragment) return Math.max(floor, next);
            const before = Math.max(floor, previous);
            const after = Math.max(floor, previous + next);
            return Math.max(0, after - before);
          }"""
          flow_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in flow_replacement.splitlines())
          pag, flow_count = flow_pattern.subn(flow_replacement, pag, count=1)
          if flow_count != 1:
              raise SystemExit(f'sectionFlowContributionPx replacement count={flow_count}')

          fit_anchor = '/** Check if an HTML string contains HTML tags */'
          fit_helper = """/**
           * Last-resort fit for a truly unsplittable authored unit, e.g. one rowspan
           * group taller than an entire body area. Normal text/list/table/media split
           * paths run first. The fallback preserves the complete unit inside A4.
           */
          export function fitOversizedBlockHtmlToPage(
            html: string,
            measuredHeightPx: number,
            maxHeightPx: number
          ): string {
            const measured = Number.isFinite(measuredHeightPx) ? Math.max(0, measuredHeightPx) : 0;
            const limit = Number.isFinite(maxHeightPx) ? Math.max(1, maxHeightPx) : 1;
            if (!html || measured <= 0 || measured <= limit + 0.5) return html;
            const scale = Math.max(0.001, Math.min(1, limit / measured));
            const fittedHeight = Math.max(1, Math.floor(measured * scale));
            const expandedWidth = 100 / scale;
            return `<div data-sop-page-fit-block="true" style="position:relative;width:100%;height:${fittedHeight}px;box-sizing:border-box"><div data-sop-page-fit-block-inner="true" style="position:absolute;left:0;top:0;width:${expandedWidth.toFixed(4)}%;transform:scale(${scale.toFixed(6)});transform-origin:top left">${html}</div></div>`;
          }

          """
          fit_helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in fit_helper.splitlines()) + '\n'
          if fit_anchor not in pag:
              raise SystemExit('Fit helper anchor not found')
          pag = pag.replace(fit_anchor, fit_helper + fit_anchor, 1)

          old_safety = '  const safety = options?.safetyBufferPx ?? 4;'
          if old_safety not in pag:
              raise SystemExit('Safety line not found')
          pag = pag.replace(old_safety, '  const safety = Math.max(MIN_A4_SAFETY_BUFFER_PX, options?.safetyBufferPx ?? MIN_A4_SAFETY_BUFFER_PX);', 1)

          initial_pattern = re.compile(r"    const contentContribution = sectionFlowContributionPx\(\n      currentSectionRawHeight,\n      flowHeights\[index\],\n      startsNewSectionRow\n    \);")
          initial_replacement = """    const sectionMinimumContentHeight = Math.max(
                LIVE_SOP_SECTION_MIN_HEIGHT_PX,
                getCanonicalSectionLabelMinimumHeightPx(block.section)
              );
              const contentContribution = sectionFlowContributionPx(
                currentSectionRawHeight,
                flowHeights[index],
                startsNewSectionRow,
                sectionMinimumContentHeight
              );"""
          initial_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in initial_replacement.splitlines())
          pag, initial_count = initial_pattern.subn(initial_replacement, pag, count=1)
          if initial_count != 1:
              raise SystemExit(f'Initial contribution replacement count={initial_count}')

          split_pattern = re.compile(r"sectionFlowContributionPx\(\n\s+currentSectionRawHeight,\n\s+firstHeight,\n\s+startsNewSectionRow\n\s+\) \+ chrome")
          split_replacement = """sectionFlowContributionPx(
              currentSectionRawHeight,
              firstHeight,
              startsNewSectionRow,
              sectionMinimumContentHeight
            ) + chrome"""
          split_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in split_replacement.splitlines())
          pag, split_count = split_pattern.subn(split_replacement, pag)
          if split_count < 3:
              raise SystemExit(f'Expected >=3 split contribution replacements, got {split_count}')

          unsplit_pattern = re.compile(r"        // An unsplittable block must NEVER fall through and be clipped by the\n[\s\S]*?        commitCurrentPageAndStartNext\(\);\n        continue;", re.M)
          unsplit_replacement = """        // Pathological fresh-page monolith: every ordinary split strategy has
                  // failed. Fit the complete authored unit proportionally. Never emit a
                  // block that is allowed to paint beyond the 297mm paper boundary.
                  const pageRemaining = Math.max(1, capacity - chrome);
                  const fittedHtml = fitOversizedBlockHtmlToPage(block.html, flowHeights[index], pageRemaining);
                  const fittedHeight = Math.min(pageRemaining, measureFlowPart(fittedHtml));
                  const fittedBlock: OfficialBlock = {
                    ...block,
                    id: `${block.id}-page-fit`,
                    html: fittedHtml
                  };
                  currentPageBlocks.push(fittedBlock);
                  used = Math.min(
                    capacity,
                    sectionFlowContributionPx(0, fittedHeight, true, sectionMinimumContentHeight) + chrome
                  );
                  currentSectionRawHeight = fittedHeight;
                  currentSection = block.section;
                  index += 1;
                  commitCurrentPageAndStartNext();
                  continue;"""
          unsplit_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in unsplit_replacement.splitlines())
          pag, unsplit_count = unsplit_pattern.subn(unsplit_replacement, pag, count=1)
          if unsplit_count != 1:
              raise SystemExit(f'Unsplittable fallback replacement count={unsplit_count}')

          if 'data-sop-unsplittable-overflow' in pag:
              raise SystemExit('Old overflow escape still present')
          pag_path.write_text(pag, encoding='utf-8')

          test_path = Path('tests/a4-page-boundary-contract.test.ts')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const css = readFileSync('src/index.css', 'utf8');
          const paginator = readFileSync('src/utils/canonicalA4Pagination.ts', 'utf8');

          test('physical A4 sheets are hard paint boundaries in Preview/PDF and Live', () => {
            assert.match(css, /#printable-sop-official-document \\.sop-preview-page,[\\s\\S]*?\\.sop-live-a4-page,[\\s\\S]*?overflow:\\s*hidden !important;[\\s\\S]*?max-height:\\s*297mm !important;[\\s\\S]*?contain:\\s*paint;/);
            assert.doesNotMatch(css, /#printable-sop-official-document\\s*,\\s*#printable-sop-official-document \\*\\s*\\{[^}]*overflow:\\s*visible !important;/);
            assert.match(css, /\\[data-sop-page-fit-block=\"true\"\\]\\s*\\{[^}]*overflow:\\s*hidden !important;/);
          });

          test('canonical paginator reserves rounding room and has no intentional overflow escape', () => {
            assert.match(paginator, /MIN_A4_SAFETY_BUFFER_PX\\s*=\\s*8/);
            assert.match(paginator, /getCanonicalSectionLabelMinimumHeightPx/);
            assert.match(paginator, /fitOversizedBlockHtmlToPage/);
            assert.match(paginator, /data-sop-page-fit-block/);
            assert.doesNotMatch(paginator, /data-sop-unsplittable-overflow/);
          });
          """.replace(/^          /gm, ''), encoding='utf-8')

          # Fix the one JS-style indentation cleanup above before Python parses it is
          # impossible, so rewrite the just-created file if this script reaches here.
          # (The workflow source itself is Python; use explicit de-indent instead.)
          test_text = test_path.read_text(encoding='utf-8')
          test_text = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_text.splitlines()) + '\n'
          test_path.write_text(test_text, encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = pkg_path.read_text(encoding='utf-8')
          old_tail = 'tests/table-interaction-regression.test.ts tests/preview-list-numbering-table.test.ts"'
          new_tail = 'tests/table-interaction-regression.test.ts tests/preview-list-numbering-table.test.ts tests/a4-page-boundary-contract.test.ts"'
          if old_tail not in pkg:
              raise SystemExit('test:tables tail not found')
          pkg_path.write_text(pkg.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run table and A4 regression suite
        run: npm run test:tables

      - name: Build web client
        run: npm run build:client

      - name: Verify hard-boundary contract
        run: |
          ! grep -q 'data-sop-unsplittable-overflow' src/utils/canonicalA4Pagination.ts
          grep -q 'data-sop-page-fit-block' src/utils/canonicalA4Pagination.ts
          grep -q 'HARD A4 BOUNDARY CONTRACT' src/index.css
          grep -q 'a4-page-boundary-contract.test.ts' package.json

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/a4-hard-boundary-patch.yml .github/workflows/a4-hard-boundary-patch-retry.yml .github/workflows/a4-hard-boundary-patch-final.yml
          git add src/index.css src/utils/canonicalA4Pagination.ts tests/a4-page-boundary-contract.test.ts package.json
          git commit -m 'fix: enforce canonical A4 bottom boundary for all SPO content'
          git push origin HEAD:fix/a4-hard-boundary-20260925
