name: iOS Stage 4 Patch

on:
  push:
    branches:
      - ios/tahap-4-auth-api-session

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply native runtime patch
        run: python3 scripts/ios_stage4_patch.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify runtime endpoint contract
        run: npx tsx tests/ios-runtime-endpoints.test.ts

      - name: Verify functions syntax
        run: node --check functions/index.js

      - name: Build web client
        run: npm run build:client

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Compile iOS simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit stage 4 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src functions/index.js tests/ios-runtime-endpoints.test.ts ios
          git commit -m "fix(ios): route native auth API and protected storage safely"
          git push origin HEAD:ios/tahap-4-auth-api-session
