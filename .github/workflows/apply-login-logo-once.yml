name: Apply Login Logo Once

on:
  push:
    branches:
      - feat/login-logo-brand

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/login-logo-brand
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Replace login title with SIDOKTER logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/LoginPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = '              {/* Main App Title */}\n              <div className="login-brand-hero">\n                <div className="login-brand-title" aria-label="SIDOKTER">\n                  <span className="login-brand-title-light">SIDO</span>\n                  <span className="login-brand-title-accent">KTER</span>\n                </div>\n                <h1 className="login-brand-system-name">\n                  Sistem Dokumen Terpadu RSUD Dr. Soegiri Lamongan\n                </h1>\n                <p className="login-brand-desc">'
          new = '              {/* Main App Brand */}\n              <div className="login-brand-hero">\n                <img\n                  src="/sidokter-logo-v2.webp"\n                  alt="SIDOKTER — Sistem Dokumen Terpadu"\n                  className="block w-full max-w-[400px] h-auto object-contain object-left mb-4"\n                />\n                <p className="login-brand-desc">'
          if old not in text:
              raise SystemExit('Target login brand block was not found; aborting safe patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/LoginPage.tsx

      - name: Commit verified login logo update
        shell: bash
        run: |
          rm -f .github/workflows/apply-login-logo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx .github/workflows/apply-login-logo-once.yml
          git commit -m "feat: use SIDOKTER logo on login brand panel"
          git push origin HEAD:feat/login-logo-brand
