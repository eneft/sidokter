name: iOS Stage 5 Native UX

on:
  push:
    branches:
      - ios/tahap-5-native-ux-lifecycle

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: macos-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install official Capacitor native UX plugins
        run: npm install --save @capacitor/app@^8 @capacitor/network@^8 @capacitor/keyboard@^8 @capacitor/status-bar@^8 @capacitor/splash-screen@^8 @capacitor/filesystem@^8 @capacitor/share@^8 @capacitor/browser@^8
      - name: Apply native UX patch
        run: |
          python3 scripts/ios_stage5_patch.py
          python3 scripts/ios_stage5_fix_config.py
      - name: Verify native UX contract
        run: npx tsx tests/ios-native-ux-contract.test.ts
      - name: Lint TypeScript
        run: npm run lint
      - name: Build web client
        run: npm run build:client
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Compile iOS simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Commit verified Stage 5 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json capacitor.config.ts ios src tests/ios-native-ux-contract.test.ts
          git commit -m "feat(ios): native UX and lifecycle integration" || exit 0
          git push
