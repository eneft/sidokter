name: Patch Administrator Number Sync

on:
  push:
    branches:
      - fix/administrator-number-sync-sequential
    paths:
      - .github/workflows/patch-number-sync.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/administrator-number-sync-sequential
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch-number-sync.py

      - name: Install client dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Verify Functions syntax and exports
        run: npm run verify:functions

      - name: Test numbering lifecycle and synchronization
        run: npm run test:numbering-lifecycle

      - name: Regression test trusted SPO edit boundary
        run: npm run test:sop-edit

      - name: Build web client
        run: npm run build:client

      - name: Validate diff
        run: git diff --check

      - name: Commit verified patch
        run: |
          rm -f scripts/patch-number-sync.py .github/workflows/patch-number-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make administrator SPO number sync sequential and authoritative"
          git push origin HEAD:fix/administrator-number-sync-sequential
