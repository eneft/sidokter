name: Fix Login Logo Contrast Once

on:
  push:
    branches:
      - fix/login-logo-contrast

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/login-logo-contrast
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Patch login logo contrast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/LoginPage.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''                <img
                  src="/sidokter-logo-v2.webp"
                  alt="SIDOKTER — Sistem Dokumen Terpadu"
                  className="block w-full max-w-[400px] h-auto object-contain object-left mb-4"
                />'''

          new = '''                <div
                  className="relative w-full max-w-[400px] mb-4"
                  role="img"
                  aria-label="SIDOKTER — Sistem Dokumen Terpadu"
                >
                  <img
                    src="/sidokter-logo-v2.webp"
                    alt=""
                    className="block w-full h-auto object-contain object-left"
                  />
                  <img
                    src="/sidokter-logo-v2.webp"
                    alt=""
                    aria-hidden="true"
                    className="pointer-events-none absolute inset-0 block w-full h-auto object-contain object-left brightness-0 invert"
                    style={{ clipPath: 'inset(0 0 0 26%)' }}
                  />
                </div>'''

          if old not in text:
              raise SystemExit('Target login logo block was not found; aborting safe patch.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/LoginPage.tsx

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-login-logo-contrast-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx .github/workflows/fix-login-logo-contrast-once.yml
          git commit -m "fix: improve SIDOKTER logo contrast on login"
          git push origin HEAD:fix/login-logo-contrast
