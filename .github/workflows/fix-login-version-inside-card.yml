name: Fix login version placement

on:
  push:
    branches:
      - fix/login-version-inside-card

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Move version into desktop login panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/LoginPage.tsx')
          text = path.read_text(encoding='utf-8')

          security_tail = '''              {/* Official Security Seal */}\n              <div className="login-security-note">\n                <ShieldCheck className="login-security-icon" aria-hidden="true" />\n                <span>\n                  Akses terenkripsi khusus pegawai &amp; staf unit kerja RSUD Dr. Soegiri Lamongan.\n                </span>\n              </div>\n\n            </div>\n'''
          replacement = '''              {/* Official Security Seal */}\n              <div className="login-security-note">\n                <ShieldCheck className="login-security-icon" aria-hidden="true" />\n                <span>\n                  Akses terenkripsi khusus pegawai &amp; staf unit kerja RSUD Dr. Soegiri Lamongan.\n                </span>\n              </div>\n\n              {/* Desktop application version — inside the right login panel */}\n              <div\n                className="hidden lg:block mt-5 border-t border-slate-100 pt-3 text-center text-[10px] font-semibold tracking-[0.04em] text-slate-400"\n                aria-label="Versi aplikasi SIDOKTER"\n              >\n                SIDOKTER V. 1.0.0\n              </div>\n\n            </div>\n'''
          if text.count(security_tail) != 1:
              raise SystemExit('Expected exactly one security-note tail')
          text = text.replace(security_tail, replacement)

          outside = '''\n        <div className="login-version-note" aria-label="Versi aplikasi SIDOKTER">\n          SIDOKTER V. 1.0.0\n        </div>\n'''
          if text.count(outside) != 1:
              raise SystemExit('Expected exactly one outside version note')
          text = text.replace(outside, '')

          if text.count('SIDOKTER V. 1.0.0') != 1:
              raise SystemExit('Expected exactly one version label after patch')
          if 'className="login-version-note"' in text:
              raise SystemExit('Outside version note still present')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify build and scope
        shell: bash
        run: |
          npm ci
          npm run build:client
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git diff --name-only | grep -Fx "src/components/LoginPage.tsx"
          grep -F "Desktop application version — inside the right login panel" src/components/LoginPage.tsx
          test "$(grep -F -c 'SIDOKTER V. 1.0.0' src/components/LoginPage.tsx)" = "1"
          ! grep -F 'className="login-version-note"' src/components/LoginPage.tsx

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-login-version-inside-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx .github/workflows/fix-login-version-inside-card.yml
          git commit -m "fix: place SIDOKTER version inside login panel"
          git push origin HEAD:fix/login-version-inside-card
