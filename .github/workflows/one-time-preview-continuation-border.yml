name: One-time Preview Continuation Border Repair

on:
  push:
    branches:
      - fix/preview-continuation-bottom-border

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/preview-continuation-bottom-border
          fetch-depth: 0

      - name: Apply guarded repair
        run: python .github/scripts/fix-preview-continuation-border.py

      - name: Install dependencies
        run: npm ci

      - name: Run Live/Preview pagination regression tests
        run: npm run test:live-pagination

      - name: Build web client
        run: npm run build:client

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SopDetailModal.tsx tests/live-sop-content-integrity.test.ts
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Restore preview continuation bottom boundary"
          git push origin HEAD:fix/preview-continuation-bottom-border
