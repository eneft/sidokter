name: Apply A4 Hard Boundary Patch

on:
  push:
    branches:
      - fix/a4-hard-boundary-20260925
    paths:
      - '.github/workflows/a4-hard-boundary-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/a4-hard-boundary-20260925

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply canonical A4 boundary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------------
          # 1) CSS: page is the hard paint boundary on screen, print and PDF.
          # ------------------------------------------------------------------
          css_path = Path('src/index.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = '''/* Eradicate any accidental nested scrollbars, clipping, or height caps inside official SOP documents */
          .sop-batang-tubuh-content,
          .sop-batang-tubuh-content *,
          .rich-text-output,
          .rich-text-output *,
          .rich-text-document-content,
          .rich-text-document-content *,
          #printable-sop-official-document,
          #printable-sop-official-document * {
            overflow: visible !important;
            max-height: none !important;
          }
          '''.replace('          ', '')
          new_css = '''/* Rich text may flow naturally inside its table cell, but the physical A4
             sheet itself must remain the final paint/height boundary. Never apply the
             old #printable-sop-official-document * overflow override to page shells. */
          .sop-batang-tubuh-content,
          .sop-batang-tubuh-content *,
          .rich-text-output,
          .rich-text-output *,
          .rich-text-document-content,
          .rich-text-document-content * {
            overflow: visible !important;
            max-height: none !important;
          }

          /* HARD A4 BOUNDARY CONTRACT — desktop, mobile Safari, print and PDF.
             Canonical pagination decides which content belongs to a page; CSS is only
             the final paint guard. Transformed/absolute images and imported Word nodes
             may never draw into the 20mm bottom margin or the next sheet. */
          #printable-sop-official-document .sop-preview-page,
          #printable-sop-official-document.pdf-export-document .sop-preview-page,
          .sop-live-a4-page,
          .sop-measure-root [data-measure-page] {
            overflow: hidden !important;
            max-height: 297mm !important;
            box-sizing: border-box !important;
            contain: paint;
            isolation: isolate;
          }

          #printable-sop-official-document .sop-preview-page > .sop-a4-content-frame,
          .sop-live-a4-page > .sop-a4-content-frame {
            height: 100% !important;
            max-height: 100% !important;
            min-height: 0 !important;
            box-sizing: border-box !important;
          }

          /* Pathological one-piece content (for example one rowspan group taller than
             a whole body area) is proportionally fitted by the paginator rather than
             leaking or being silently cropped at the paper edge. RichTextRenderer
             strips inline overflow declarations, therefore this marker owns clipping. */
          [data-sop-page-fit-block="true"] {
            overflow: hidden !important;
            contain: paint;
            max-width: 100% !important;
          }
          '''.replace('          ', '')
          if old_css not in css:
              raise SystemExit('Expected broad printable overflow rule not found')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')

          # ------------------------------------------------------------------
          # 2) Pagination: reserve browser rounding, label height, and fit a truly
          #    unsplittable monolith instead of intentionally letting it overflow.
          # ------------------------------------------------------------------
          pag_path = Path('src/utils/canonicalA4Pagination.ts')
          pag = pag_path.read_text(encoding='utf-8')

          pag = pag.replace(
              "const OFFICIAL_CELL_HORIZONTAL_BORDER_PX = 2;\n",
              "const OFFICIAL_CELL_HORIZONTAL_BORDER_PX = 2;\nexport const MIN_A4_SAFETY_BUFFER_PX = 8;\nconst OFFICIAL_BODY_FONT_PX = 12 * (96 / 72);\nconst OFFICIAL_SECTION_LABEL_LINE_HEIGHT_PX = OFFICIAL_BODY_FONT_PX * 1.4;\n",
              1,
          )

          anchor = '''export function getCanonicalSectionRowChromePx(): number {
            return SOP_SECTION_CELL_PADDING_MM * 2 * CSS_PX_PER_MM + 1;
          }
          '''.replace('          ', '')
          addition = anchor + '''
          /** Minimum text height of the left-hand official section label. Two-line
           * labels must participate in pagination even when the right cell is short. */
          export function getCanonicalSectionLabelMinimumHeightPx(section: OfficialSectionKey): number {
            const lineCount = section === 'ALUR / BAGAN ALIR' || section === 'UNIT TERKAIT' ? 2 : 1;
            return Math.ceil(lineCount * OFFICIAL_SECTION_LABEL_LINE_HEIGHT_PX);
          }
          '''.replace('          ', '')
          if anchor not in pag:
              raise SystemExit('Section row chrome anchor not found')
          pag = pag.replace(anchor, addition, 1)

          old_flow = '''export function sectionFlowContributionPx(
            previousRawHeightPx: number,
            nextRawHeightPx: number,
            startsNewSectionFragment: boolean
          ): number {
            const previous = Number.isFinite(previousRawHeightPx) ? Math.max(0, previousRawHeightPx) : 0;
            const next = Number.isFinite(nextRawHeightPx) ? Math.max(0, nextRawHeightPx) : 0;
            if (startsNewSectionFragment) {
              return Math.max(LIVE_SOP_SECTION_MIN_HEIGHT_PX, next);
            }
            const before = Math.max(LIVE_SOP_SECTION_MIN_HEIGHT_PX, previous);
            const after = Math.max(LIVE_SOP_SECTION_MIN_HEIGHT_PX, previous + next);
            return Math.max(0, after - before);
          }
          '''.replace('          ', '')
          new_flow = '''export function sectionFlowContributionPx(
            previousRawHeightPx: number,
            nextRawHeightPx: number,
            startsNewSectionFragment: boolean,
            minimumContentHeightPx: number = LIVE_SOP_SECTION_MIN_HEIGHT_PX
          ): number {
            const previous = Number.isFinite(previousRawHeightPx) ? Math.max(0, previousRawHeightPx) : 0;
            const next = Number.isFinite(nextRawHeightPx) ? Math.max(0, nextRawHeightPx) : 0;
            const floor = Number.isFinite(minimumContentHeightPx)
              ? Math.max(LIVE_SOP_SECTION_MIN_HEIGHT_PX, minimumContentHeightPx)
              : LIVE_SOP_SECTION_MIN_HEIGHT_PX;
            if (startsNewSectionFragment) {
              return Math.max(floor, next);
            }
            const before = Math.max(floor, previous);
            const after = Math.max(floor, previous + next);
            return Math.max(0, after - before);
          }
          '''.replace('          ', '')
          if old_flow not in pag:
              raise SystemExit('sectionFlowContributionPx block not found')
          pag = pag.replace(old_flow, new_flow, 1)

          html_anchor = '/** Check if an HTML string contains HTML tags */'
          fit_helper = '''/**
           * Last-resort fit for a truly unsplittable authored unit (for example one
           * rowspan group taller than an entire page body). Normal text, list, table
           * row and media split paths run first. This preserves every pixel of the
           * monolith inside the A4 box instead of allowing cross-page paint or clipping.
           */
          export function fitOversizedBlockHtmlToPage(
            html: string,
            measuredHeightPx: number,
            maxHeightPx: number
          ): string {
            const measured = Number.isFinite(measuredHeightPx) ? Math.max(0, measuredHeightPx) : 0;
            const limit = Number.isFinite(maxHeightPx) ? Math.max(1, maxHeightPx) : 1;
            if (!html || measured <= 0 || measured <= limit + 0.5) return html;

            const scale = Math.max(0.001, Math.min(1, limit / measured));
            const fittedHeight = Math.max(1, Math.floor(measured * scale));
            const expandedWidth = 100 / scale;
            return `<div data-sop-page-fit-block="true" style="position:relative;width:100%;height:${fittedHeight}px;box-sizing:border-box"><div data-sop-page-fit-block-inner="true" style="position:absolute;left:0;top:0;width:${expandedWidth.toFixed(4)}%;transform:scale(${scale.toFixed(6)});transform-origin:top left">${html}</div></div>`;
          }

          '''.replace('          ', '')
          if html_anchor not in pag:
              raise SystemExit('HTML helper anchor not found')
          pag = pag.replace(html_anchor, fit_helper + html_anchor, 1)

          old_safety = '  const safety = options?.safetyBufferPx ?? 4;\n'
          new_safety = '  const safety = Math.max(MIN_A4_SAFETY_BUFFER_PX, options?.safetyBufferPx ?? MIN_A4_SAFETY_BUFFER_PX);\n'
          if old_safety not in pag:
              raise SystemExit('Safety buffer line not found')
          pag = pag.replace(old_safety, new_safety, 1)

          old_initial_contribution = '''    const contentContribution = sectionFlowContributionPx(
                currentSectionRawHeight,
                flowHeights[index],
                startsNewSectionRow
              );
          '''.replace('          ', '')
          new_initial_contribution = '''    const sectionMinimumContentHeight = Math.max(
                LIVE_SOP_SECTION_MIN_HEIGHT_PX,
                getCanonicalSectionLabelMinimumHeightPx(block.section)
              );
              const contentContribution = sectionFlowContributionPx(
                currentSectionRawHeight,
                flowHeights[index],
                startsNewSectionRow,
                sectionMinimumContentHeight
              );
          '''.replace('          ', '')
          if old_initial_contribution not in pag:
              raise SystemExit('Initial section contribution block not found')
          pag = pag.replace(old_initial_contribution, new_initial_contribution, 1)

          old_split_contribution = '''sectionFlowContributionPx(
                        currentSectionRawHeight,
                        firstHeight,
                        startsNewSectionRow
                      ) + chrome'''.replace('          ', '')
          new_split_contribution = '''sectionFlowContributionPx(
                        currentSectionRawHeight,
                        firstHeight,
                        startsNewSectionRow,
                        sectionMinimumContentHeight
                      ) + chrome'''.replace('          ', '')
          split_count = pag.count(old_split_contribution)
          if split_count < 3:
              raise SystemExit(f'Expected >=3 split contribution calls, found {split_count}')
          pag = pag.replace(old_split_contribution, new_split_contribution)

          old_unsplittable = '''        // An unsplittable block must NEVER fall through and be clipped by the
                  // physical A4 page. This should only be reachable for pathological
                  // authored content (for example one table row taller than a full page).
                  // Keep it visible instead of silently cropping it; the normal table and
                  // media paths above prevent this for valid content.
                  const unsplittable: OfficialBlock = {
                    ...block,
                    html: block.html.replace(
                      /^(<(?:table|ol|ul|p|div|blockquote)\\b)/i,
                      '$1 data-sop-unsplittable-overflow="true"'
                    )
                  };
                  currentPageBlocks.push(unsplittable);
                  used = capacity;
                  currentSection = block.section;
                  index += 1;
                  commitCurrentPageAndStartNext();
                  continue;
          '''.replace('          ', '')
          new_unsplittable = '''        // Pathological fresh-page monolith: all ordinary text/list/table/media
                  // split strategies above have failed. Fit the complete authored unit
                  // proportionally inside the remaining body area. Never intentionally
                  // emit content that paints beyond the 297mm page boundary.
                  const pageRemaining = Math.max(1, capacity - chrome);
                  const fittedHtml = fitOversizedBlockHtmlToPage(
                    block.html,
                    flowHeights[index],
                    pageRemaining
                  );
                  const fittedHeight = Math.min(pageRemaining, measureFlowPart(fittedHtml));
                  const fittedBlock: OfficialBlock = {
                    ...block,
                    id: `${block.id}-page-fit`,
                    html: fittedHtml
                  };
                  currentPageBlocks.push(fittedBlock);
                  used = Math.min(
                    capacity,
                    sectionFlowContributionPx(
                      0,
                      fittedHeight,
                      true,
                      sectionMinimumContentHeight
                    ) + chrome
                  );
                  currentSectionRawHeight = fittedHeight;
                  currentSection = block.section;
                  index += 1;
                  commitCurrentPageAndStartNext();
                  continue;
          '''.replace('          ', '')
          if old_unsplittable not in pag:
              raise SystemExit('Old unsplittable overflow fallback not found')
          pag = pag.replace(old_unsplittable, new_unsplittable, 1)

          pag_path.write_text(pag, encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) Regression contract: future CSS/paginator work may not reopen this.
          # ------------------------------------------------------------------
          test_path = Path('tests/a4-page-boundary-contract.test.ts')
          test_path.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const css = readFileSync('src/index.css', 'utf8');
          const paginator = readFileSync('src/utils/canonicalA4Pagination.ts', 'utf8');

          test('physical A4 sheets are hard paint boundaries in Preview/PDF and Live', () => {
            assert.match(css, /#printable-sop-official-document \.sop-preview-page,[\s\S]*?\.sop-live-a4-page,[\s\S]*?overflow:\s*hidden !important;[\s\S]*?max-height:\s*297mm !important;[\s\S]*?contain:\s*paint;/);
            assert.doesNotMatch(css, /#printable-sop-official-document\s*,\s*#printable-sop-official-document \*\s*\{[^}]*overflow:\s*visible !important;/);
            assert.match(css, /\[data-sop-page-fit-block="true"\]\s*\{[^}]*overflow:\s*hidden !important;/);
          });

          test('canonical paginator reserves rounding room and cannot intentionally overflow', () => {
            assert.match(paginator, /MIN_A4_SAFETY_BUFFER_PX\s*=\s*8/);
            assert.match(paginator, /getCanonicalSectionLabelMinimumHeightPx/);
            assert.match(paginator, /fitOversizedBlockHtmlToPage/);
            assert.match(paginator, /data-sop-page-fit-block/);
            assert.doesNotMatch(paginator, /data-sop-unsplittable-overflow/);
          });
          '''.replace(/^          /gm, ''), encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = pkg_path.read_text(encoding='utf-8')
          old_tail = 'tests/table-interaction-regression.test.ts tests/preview-list-numbering-table.test.ts"'
          new_tail = 'tests/table-interaction-regression.test.ts tests/preview-list-numbering-table.test.ts tests/a4-page-boundary-contract.test.ts"'
          if old_tail not in pkg:
              raise SystemExit('test:tables script tail not found')
          pkg = pkg.replace(old_tail, new_tail, 1)
          pkg_path.write_text(pkg, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run table and A4 regression suite
        run: npm run test:tables

      - name: Build web client
        run: npm run build:client

      - name: Verify no page-overflow escape remains
        shell: bash
        run: |
          ! grep -q 'data-sop-unsplittable-overflow' src/utils/canonicalA4Pagination.ts
          grep -q 'data-sop-page-fit-block' src/utils/canonicalA4Pagination.ts
          grep -q 'HARD A4 BOUNDARY CONTRACT' src/index.css
          grep -q 'a4-page-boundary-contract.test.ts' package.json

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/a4-hard-boundary-patch.yml
          git add src/index.css src/utils/canonicalA4Pagination.ts tests/a4-page-boundary-contract.test.ts package.json
          git commit -m 'fix: enforce canonical A4 bottom boundary for all SPO content'
          git push origin HEAD:fix/a4-hard-boundary-20260925
