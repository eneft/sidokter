name: Enforce Strict A4 Page Boundary

on:
  push:
    branches:
      - fix/mobile-a4-pagination-overflow
    paths:
      - '.github/workflows/strict-a4-page-boundary.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mobile-a4-pagination-overflow

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Strengthen physical A4 overflow invariant
        run: python scripts/apply-strict-a4-boundary-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run A4 pagination regression tests
        run: |
          node --test tests/sop-preview-mobile-pagination.test.cjs
          node --test tests/sop-preview-a4-boundary.test.cjs

      - name: Verify client build
        run: npm run build:client

      - name: Commit strict A4 fix and remove temporary patch files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/strict-a4-page-boundary.yml scripts/apply-strict-a4-boundary-fix.py
          git add src/components/SopDetailModal.tsx tests/sop-preview-a4-boundary.test.cjs
          git commit -m 'fix: keep SPO content inside physical A4 safe area'
          git push origin fix/mobile-a4-pagination-overflow
