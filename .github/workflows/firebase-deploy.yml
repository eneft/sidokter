name: SIDOKTER Build Verification & Firebase Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify SIDOKTER
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Verify Functions
        run: npm run verify:functions

      - name: Test Riviu Revision Authority
        run: npx tsx --test tests/riviu-revision-authority.test.ts

      - name: Test Hierarchy Cloud Boundary
        run: npm run test:hierarchy

      - name: Test SPO Edit and Numbering Boundaries
        run: |
          npm run test:sop-edit
          npm run test:numbering-lifecycle
          node --test tests/sop-mutation-regression.test.cjs

      - name: Test Tables
        run: npm run test:tables

      - name: Build Web Client
        run: npm run build:client

  deploy:
    name: Deploy Firebase Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Build Web Client
        run: npm run build:client

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIDOKTER_SOEGIRI }}

      - name: Deploy Hosting, Functions, and Firestore Rules
        id: firebase_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx firebase-tools@15.22.1 deploy --only hosting,functions,firestore:rules --project sidokter-soegiri --non-interactive 2>&1 | tee firebase-deploy-diagnostic.log

      - name: Upload Firebase deploy diagnostic
        if: steps.firebase_deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-diagnostic
          path: firebase-deploy-diagnostic.log
          retention-days: 1

      - name: Fail after diagnostic capture
        if: steps.firebase_deploy.outcome == 'failure'
        run: exit 1
