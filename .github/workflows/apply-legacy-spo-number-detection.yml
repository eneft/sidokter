name: Apply Legacy SPO Number Detection Patch

on:
  push:
    paths:
      - '.github/workflows/apply-legacy-spo-number-detection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python scripts/apply-legacy-spo-number-detection.py

      - name: Commit patched files and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/riviuRevision.ts src/components/UploadSopModal.tsx src/components/EditSopModal.tsx tests/riviu-revision-authority.test.ts
          git rm scripts/apply-legacy-spo-number-detection.py .github/workflows/apply-legacy-spo-number-detection.yml
          git commit -m "fix: detect legacy SPO numbers in Riviu workflow"
          git push
