name: Mailbox Direct Backend Delivery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mailbox-direct-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply direct backend mailbox patch
        run: python3 scripts/mailbox-direct-backend.py

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Verify functions
        run: npm run verify:functions

      - name: Test mail architecture
        run: npm run test:mail

      - name: Build client
        run: npm run build:client

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js functions/mailboxWorkflow.js functions/main.js tests/notification-architecture.test.cjs
          git commit -m "fix: deliver workflow mail from trusted SPO backend"
          git push
