name: Apply SK Style SPO Archive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_sk_style_to_spo_archive.py'
      - '.github/workflows/apply-sk-style-spo-archive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI patch
        run: python scripts/apply_sk_style_to_spo_archive.py
      - name: Install dependencies
        run: npm ci
      - name: Verify client build
        run: npm run build:client
      - name: Commit UI changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/UserLibraryTab.tsx src/components/FinalLibraryPage.tsx src/components/UserView.tsx src/App.tsx
          git commit -m 'ui: align SPO and digital archive with SK register'
          git push origin main
