name: Fix login desktop footer placement

on:
  push:
    branches:
      - fix/login-desktop-footer-placement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply login-only desktop patch
        shell: bash
        run: |
          git checkout 098012f75165c4a7594da2e646cd06fd670e6145 -- src/components/Header.tsx

          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/LoginPage.tsx')
          text = path.read_text(encoding='utf-8')

          accreditation = '''              {/* Bottom Hospital Footer Note */}\n              <div className="login-brand-footer-note">\n                <span className="login-brand-footer-dot">•</span>\n                <span>Terakreditasi Paripurna</span>\n              </div>\n'''
          if text.count(accreditation) != 1:
              raise SystemExit('Expected exactly one accreditation note')
          text = text.replace(accreditation, '')

          security_tail = '''              {/* Official Security Seal */}\n              <div className="login-security-note">\n                <ShieldCheck className="login-security-icon" aria-hidden="true" />\n                <span>\n                  Akses terenkripsi khusus pegawai &amp; staf unit kerja RSUD Dr. Soegiri Lamongan.\n                </span>\n              </div>\n            </div>\n'''
          desktop_footer_tail = '''              {/* Official Security Seal */}\n              <div className="login-security-note">\n                <ShieldCheck className="login-security-icon" aria-hidden="true" />\n                <span>\n                  Akses terenkripsi khusus pegawai &amp; staf unit kerja RSUD Dr. Soegiri Lamongan.\n                </span>\n              </div>\n\n              {/* Desktop-only footer inside the login card */}\n              <div className="hidden lg:block mt-5 border-t border-slate-100 pt-3 text-center text-[10px] font-medium leading-relaxed text-slate-400">\n                © 2026 {SOEGIRI_HOSPITAL_INFO.shortName} · Sistem Dokumen Terpadu (SIDOKTER) v1.0\n              </div>\n            </div>\n'''
          if text.count(security_tail) != 1:
              raise SystemExit('Expected exactly one security-note tail')
          text = text.replace(security_tail, desktop_footer_tail)

          old_global = '<footer id="login-auth-footer" className="login-page-footer">'
          new_global = '<footer id="login-auth-footer" className="login-page-footer lg:hidden">'
          if text.count(old_global) != 1:
              raise SystemExit('Expected exactly one global login footer')
          text = text.replace(old_global, new_global)

          if 'Terakreditasi Paripurna' in text:
              raise SystemExit('Accreditation text still present in LoginPage.tsx')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify build and scope
        run: |
          npm ci
          npm run build:client
          git diff HEAD --check
          ! grep -F "Terakreditasi Paripurna" src/components/LoginPage.tsx
          grep -F "login-page-footer lg:hidden" src/components/LoginPage.tsx
          grep -F "Desktop-only footer inside the login card" src/components/LoginPage.tsx
          git diff HEAD --name-only | grep -Fx "src/components/Header.tsx"
          git diff HEAD --name-only | grep -Fx "src/components/LoginPage.tsx"

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-login-footer-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx src/components/LoginPage.tsx .github/workflows/fix-login-footer-placement.yml
          git commit -m "fix: place login footer inside desktop card"
          git push origin HEAD:fix/login-desktop-footer-placement
