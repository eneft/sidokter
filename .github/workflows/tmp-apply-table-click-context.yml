name: Temporary Apply Table Click Context Fix

on:
  push:
    branches:
      - fix/live-spo-toolbar-command-bridge-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guarded audited patch
        shell: bash
        run: |
          set -euo pipefail
          message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
          if [[ "$message" != "chore: execute table click context fix" ]]; then
            echo "Not the one-shot trigger commit; no source mutation."
            exit 0
          fi
          npm ci
          python3 scripts/tmp-fix-table-click-context.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(src/components/RichTextEditor.tsx tests/live-editor-toolbar-regression.test.ts)
          [[ "${changed[*]}" == "${expected[*]}" ]]
          npx tsx --test tests/live-editor-toolbar-regression.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RichTextEditor.tsx tests/live-editor-toolbar-regression.test.ts
          git commit -m "fix: preserve table toolbar context after cell clicks"
          git push origin HEAD:fix/live-spo-toolbar-command-bridge-v3
