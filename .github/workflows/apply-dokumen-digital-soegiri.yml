name: Apply Dokumen Digital Soegiri UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dokumen-digital-soegiri.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply requested UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          final_path = Path('src/components/FinalLibraryPage.tsx')
          final = final_path.read_text(encoding='utf-8')
          if 'Arsip Digital' not in final:
              raise SystemExit('Expected Arsip Digital title not found in FinalLibraryPage.tsx')
          final = final.replace('Arsip Digital', 'Dokumen Digital Soegiri')
          final_path.write_text(final, encoding='utf-8')

          dashboard_path = Path('src/components/DashboardOverviewPage.tsx')
          dashboard = dashboard_path.read_text(encoding='utf-8')
          if 'Arsip Digital' not in dashboard:
              raise SystemExit('Expected Arsip Digital text not found in DashboardOverviewPage.tsx')
          dashboard = dashboard.replace('Arsip Digital', 'Dokumen Digital Soegiri')

          old_grid = 'grid-cols-[44px_minmax(180px,1.7fr)_minmax(120px,1.25fr)_minmax(100px,1fr)_minmax(100px,1fr)_110px]'
          new_grid = 'grid-cols-[44px_minmax(180px,1.6fr)_minmax(120px,1.15fr)_minmax(100px,0.8fr)_minmax(120px,1fr)_110px_110px]'
          grid_count = dashboard.count(old_grid)
          if grid_count < 2:
              raise SystemExit(f'Expected dashboard list grid twice, found {grid_count}')
          dashboard = dashboard.replace(old_grid, new_grid)

          old_header = '<span>No</span><span>Judul Dokumen</span><span>Nomor Dokumen</span><span>Jenis</span><span>Tanggal / Unit</span><span className="text-right">Aksi</span>'
          new_header = '<span>No</span><span>Judul Dokumen</span><span>Nomor Dokumen</span><span>Jenis</span><span>Unit / Mitra</span><span>Tanggal</span><span className="text-right">Aksi</span>'
          if old_header not in dashboard:
              raise SystemExit('Expected dashboard document-list header not found')
          dashboard = dashboard.replace(old_header, new_header, 1)

          old_unit_date = '<div className="min-w-0"><div className="text-[11px] font-semibold text-slate-600 truncate">{row.unit || \'RSUD Dr. Soegiri\'}</div><div className="text-[10px] text-slate-400">{row.date ? new Date(row.date).toLocaleDateString(\'id-ID\', { day: \'2-digit\', month: \'short\', year: \'numeric\' }) : \'—\'}</div></div>'
          new_unit_date = '<span className="text-[11px] font-semibold text-slate-600 truncate">{row.unit || \'RSUD Dr. Soegiri\'}</span>\n                  <span className="text-[11px] text-slate-500">{row.date ? new Date(row.date).toLocaleDateString(\'id-ID\', { day: \'2-digit\', month: \'short\', year: \'numeric\' }) : \'—\'}</span>'
          if old_unit_date not in dashboard:
              raise SystemExit('Expected combined Unit/Date cell not found')
          dashboard = dashboard.replace(old_unit_date, new_unit_date, 1)
          dashboard_path.write_text(dashboard, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify client build
        run: npm run build:client

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-dokumen-digital-soegiri.yml
          git add src/components/FinalLibraryPage.tsx src/components/DashboardOverviewPage.tsx
          git commit -m 'ui: rename digital library and split document date column'
          git push origin main
