name: Fix Login Safari Responsive Once

on:
  push:
    branches:
      - fix/login-safari-responsive

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/login-safari-responsive
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build white SIDOKTER login logo from original asset
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          candidates = [
              Path('public/sidokter-logo-v2.webp.webp'),
              Path('public/sidokter-logo.webp.webp'),
              Path('public/sidokter-logo-login.webp'),
          ]
          source = next((p for p in candidates if p.exists()), None)
          if source is None:
              raise SystemExit('No SIDOKTER logo source asset found.')

          image = Image.open(source).convert('RGBA')
          pixels = image.load()
          width, height = image.size

          for y in range(height):
              for x in range(width):
                  r, g, b, a = pixels[x, y]
                  if a < 200:
                      pixels[x, y] = (0, 0, 0, 0)
                      continue
                  if b >= g + 12 and b >= r + 20 and b >= 30:
                      pixels[x, y] = (255, 255, 255, 255)
                  else:
                      pixels[x, y] = (r, g, b, 255)

          target = Path('public/sidokter-logo-login.webp')
          image.save(target, 'WEBP', lossless=True, method=6)

          check = Image.open(target).convert('RGBA')
          if check.size != (width, height):
              raise SystemExit('Generated login logo dimensions changed unexpectedly.')

          white_pixels = 0
          teal_pixels = 0
          for r, g, b, a in check.getdata():
              if a < 200:
                  continue
              if r > 245 and g > 245 and b > 245:
                  white_pixels += 1
              if g > 120 and b > 100 and g >= r + 40:
                  teal_pixels += 1

          if white_pixels < 10000 or teal_pixels < 1000:
              raise SystemExit(
                  f'Generated logo color validation failed: white={white_pixels}, teal={teal_pixels}'
              )

          print(f'Generated {target} from {source}: {width}x{height}, white={white_pixels}, teal={teal_pixels}')
          PY

      - name: Add Safari and tablet login layout safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          marker = 'SIDOKTER LOGIN SAFARI/TABLET PATCH 2026-09-26'
          if marker in text:
              raise SystemExit('Safari/tablet login patch marker already exists; aborting duplicate patch.')

          block = dedent(r'''
          /* ================================================================
             SIDOKTER LOGIN SAFARI/TABLET PATCH 2026-09-26
             Keeps desktop layout intact while preventing iPad/Safari clipping
             and horizontal overflow. The login brand remains left-aligned.
             ================================================================ */
          html,
          body,
          #root {
            max-width: 100%;
            overflow-x: hidden;
          }

          #login-page-container.login-page-shell {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
          }

          #login-main-content.login-main-content {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin: 0;
            padding: clamp(16px, 3vh, 28px) clamp(16px, 3vw, 28px);
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
          }

          #login-auth-card.login-auth-card {
            width: 100%;
            max-width: 820px;
            min-width: 0;
            height: auto;
            margin: 0 auto;
            box-sizing: border-box;
          }

          .login-brand-panel,
          .login-auth-panel,
          .login-brand-content,
          .login-form-container {
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
          }

          .login-brand-hero {
            align-items: flex-start !important;
            text-align: left !important;
          }

          .login-brand-hero > img {
            display: block !important;
            width: min(100%, 420px) !important;
            max-width: 420px !important;
            height: auto !important;
            margin-left: 0 !important;
            margin-right: auto !important;
            align-self: flex-start !important;
            object-fit: contain !important;
            object-position: left center !important;
          }

          @media (min-width: 821px) and (max-height: 820px) {
            #login-page-container.login-page-shell {
              min-height: 100dvh;
              height: auto;
            }

            #login-main-content.login-main-content {
              flex: 0 0 auto;
              min-height: 100dvh;
              align-items: flex-start;
              justify-content: center;
              padding: 12px 16px 18px;
            }

            #login-auth-card.login-auth-card {
              min-height: 0;
              max-height: none;
              margin: 0 auto;
            }

            .login-brand-content,
            .login-form-container {
              padding-top: 24px !important;
              padding-bottom: 24px !important;
            }

            .login-brand-institution {
              margin-bottom: 16px !important;
            }

            .login-brand-hero > img {
              max-width: 360px !important;
              margin-bottom: 10px !important;
            }

            .login-brand-features {
              margin-top: 16px !important;
              padding-top: 16px !important;
            }

            .login-brand-footer-note {
              margin-top: 12px !important;
            }

            .login-card-header {
              margin-bottom: 16px !important;
            }

            .login-form {
              gap: 12px !important;
            }
          }

          @media (max-width: 820px) {
            #login-main-content.login-main-content {
              padding: 16px 12px;
              align-items: flex-start;
            }

            #login-auth-card.login-auth-card {
              width: 100%;
              max-width: 440px;
            }
          }
          ''')

          path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Validate focused diff
        shell: bash
        run: |
          git diff --check
          test -s public/sidokter-logo-login.webp
          git status --short

          python3 - <<'PY'
          import subprocess
          allowed = {
              'public/sidokter-logo-login.webp',
              'src/index.css',
              '.github/workflows/fix-login-safari-responsive-once.yml',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = {line[3:] for line in lines if line}
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {sorted(unexpected)}')
          print('Focused diff OK:', sorted(paths))
          PY

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-login-safari-responsive-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sidokter-logo-login.webp src/index.css .github/workflows/fix-login-safari-responsive-once.yml
          git commit -m "fix: improve Safari login layout and logo contrast"
          git push origin HEAD:fix/login-safari-responsive
