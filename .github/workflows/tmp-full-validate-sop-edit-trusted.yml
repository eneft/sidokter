name: Temporary Full Trusted SPO Edit Validation

on:
  push:
    branches:
      - fix/sop-edit-trusted-session-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sop-edit-trusted-session-boundary
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: All TypeScript regression tests
        run: npx tsx --test tests/*.test.ts

      - name: All CommonJS UI/source regression tests
        run: node --test tests/*.test.cjs

      - name: All Functions unit tests
        run: node --test functions/*.test.js

      - name: Official storage regression
        run: npm run test:storage

      - name: Official revision regression
        run: npm run test:revision

      - name: Official SOP edit regression
        run: npm run test:sop-edit

      - name: Official SOP review regression
        run: npm run test:sop-review

      - name: Official mail regression
        run: npm run test:mail

      - name: Official structured table regression
        run: npm run test:tables

      - name: Official PDF binary regression
        run: npm run test:pdf-binary

      - name: Official numbering lifecycle regression
        run: npm run test:numbering-lifecycle

      - name: Official Live pagination regression
        run: npm run test:live-pagination

      - name: Verify Firebase Functions
        run: npm run verify:functions

      - name: TypeScript noEmit
        run: npm run lint

      - name: Production client build
        run: npm run build:client

      - name: Cleanup temporary workflow after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-full-validate-sop-edit-trusted.yml
          git commit -m "chore: remove temporary trusted edit validation workflow"
          git push origin HEAD:fix/sop-edit-trusted-session-boundary
