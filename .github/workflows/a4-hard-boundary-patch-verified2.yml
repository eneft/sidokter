name: Verify A4 Hard Boundary Patch v2

on:
  push:
    branches:
      - fix/a4-hard-boundary-20260925
    paths:
      - '.github/workflows/a4-hard-boundary-patch-verified2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/a4-hard-boundary-20260925

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply audited patch and compile correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/a4-hard-boundary-patch-final.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          script = script.replace("\"\"\".replace(/^          /gm, ''), encoding='utf-8')", "\"\"\", encoding='utf-8')")
          compile(script, 'a4-hard-boundary-final', 'exec')
          exec(script)

          # The fresh-page split branch already owns pageRemaining in the same
          # lexical scope. Rename only the last-resort fitted fallback variable.
          path = Path('src/utils/canonicalA4Pagination.ts')
          text = path.read_text(encoding='utf-8')
          marker = '// Pathological fresh-page monolith: every ordinary split strategy has'
          if marker not in text:
              raise SystemExit('Fitted fallback marker missing after patch')
          before, after = text.split(marker, 1)
          after = after.replace('const pageRemaining = Math.max(1, capacity - chrome);', 'const fittedPageRemaining = Math.max(1, capacity - chrome);', 1)
          after = after.replace('fitOversizedBlockHtmlToPage(block.html, flowHeights[index], pageRemaining)', 'fitOversizedBlockHtmlToPage(block.html, flowHeights[index], fittedPageRemaining)', 1)
          after = after.replace('Math.min(pageRemaining, measureFlowPart(fittedHtml))', 'Math.min(fittedPageRemaining, measureFlowPart(fittedHtml))', 1)
          text = before + marker + after
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run table and A4 regression suite
        run: npm run test:tables

      - name: Build web client
        run: npm run build:client

      - name: Verify hard-boundary contract
        shell: bash
        run: |
          ! grep -q 'data-sop-unsplittable-overflow' src/utils/canonicalA4Pagination.ts
          grep -q 'data-sop-page-fit-block' src/utils/canonicalA4Pagination.ts
          grep -q 'fittedPageRemaining' src/utils/canonicalA4Pagination.ts
          grep -q 'HARD A4 BOUNDARY CONTRACT' src/index.css
          grep -q 'a4-page-boundary-contract.test.ts' package.json

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/a4-hard-boundary-patch.yml .github/workflows/a4-hard-boundary-patch-retry.yml .github/workflows/a4-hard-boundary-patch-final.yml .github/workflows/a4-hard-boundary-patch-final-retry.yml .github/workflows/a4-hard-boundary-patch-verified2.yml
          git add src/index.css src/utils/canonicalA4Pagination.ts tests/a4-page-boundary-contract.test.ts package.json
          git commit -m 'fix: enforce canonical A4 bottom boundary for all SPO content'
          git push origin HEAD:fix/a4-hard-boundary-20260925
