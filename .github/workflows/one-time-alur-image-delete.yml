name: One-time ALUR image deletion repair

on:
  push:
    branches:
      - fix/spo-alur-image-delete-persist

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/spo-alur-image-delete-persist
          fetch-depth: 0

      - name: Apply guarded repair
        run: python .github/scripts/fix-alur-image-delete.py

      - name: Run focused regression tests
        run: npm ci && npm run test:sop-edit && npm run build:client

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EditSopModal.tsx package.json tests/sop-alur-image-delete.test.cjs
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Fix ALUR image deletion persistence"
          git push origin HEAD:fix/spo-alur-image-delete-persist
