name: Apply Draft Riviu Legacy Field Unlock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-riviu-draft-unlock.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Draft Riviu edit workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          edit = Path('src/components/EditSopModal.tsx')
          text = edit.read_text()
          old = "readOnly={sop.status !== 'DRAFT' || Boolean(sop.oldSopNumber)}"
          new = "readOnly={sop.status !== 'DRAFT'}"
          assert old in text, 'oldSopNumber readOnly guard not found'
          text = text.replace(old, new, 1)

          old = "readOnly={sop.status !== 'DRAFT' || Boolean(sop.previousRevisionNumber)}"
          new = "readOnly={sop.status !== 'DRAFT'}"
          assert old in text, 'previousRevisionNumber readOnly guard not found'
          text = text.replace(old, new, 1)
          edit.write_text(text)

          detail = Path('src/components/SopDetailModal.tsx')
          text = detail.read_text()
          old = "{sop.oldSopNumber || '-'}"
          new = "{sop.oldSopNumber || sop.previousSopNumber || '-'}"
          assert old in text, 'Riviu preview oldSopNumber display not found'
          text = text.replace(old, new, 1)
          detail.write_text(text)

          policy = Path('functions/sopEditContentPolicy.js')
          text = policy.read_text()
          old = """  const repairableRiviuFields = new Set([\n    'existingSopId',\n    'previousRevisionNumber',\n    'previousSopNumber',\n    'oldSopNumber',\n  ]);\n  const canRepairRiviuRevision = isDraftRiviu && isBlankWorkflowValue(stored.previousRevisionNumber);\n\n  for (const field of IMMUTABLE_WORKFLOW_FIELDS) {\n"""
          new = """  const repairableRiviuFields = new Set([\n    'existingSopId',\n    'previousRevisionNumber',\n    'previousSopNumber',\n    'oldSopNumber',\n  ]);\n  const editableExternalDraftRiviuFields = new Set([\n    'previousRevisionNumber',\n    'previousSopNumber',\n    'oldSopNumber',\n  ]);\n  const isExternalDraftRiviu = isDraftRiviu && isBlankWorkflowValue(stored.existingSopId);\n  const canRepairRiviuRevision = isDraftRiviu && isBlankWorkflowValue(stored.previousRevisionNumber);\n\n  for (const field of IMMUTABLE_WORKFLOW_FIELDS) {\n"""
          assert old in text, 'Riviu policy setup block not found'
          text = text.replace(old, new, 1)

          old = """    if (canRepairRiviuRevision && (field === 'revisionNumber' || field === 'version') && submittedHasField) {\n      next[field] = submitted[field];\n    }\n"""
          new = """    if (\n      isExternalDraftRiviu\n      && editableExternalDraftRiviuFields.has(field)\n      && submittedHasField\n      && !isBlankWorkflowValue(submitted[field])\n    ) {\n      // External/legacy Riviu identity is still editable while the document is\n      // DRAFT. This permits correcting legacy number/revision metadata before\n      // activation; once ACTIVE, the normal immutable workflow rules apply.\n      next[field] = submitted[field];\n    }\n    else if (canRepairRiviuRevision && (field === 'revisionNumber' || field === 'version') && submittedHasField) {\n      next[field] = submitted[field];\n    }\n"""
          assert old in text, 'Riviu policy loop branch not found'
          text = text.replace(old, new, 1)

          marker = """  // Binary DataURLs are never authoritative Firestore data. Durable binaries\n"""
          insert = """  if (isExternalDraftRiviu) {\n    const canonicalOldNumber = String(next.oldSopNumber || next.previousSopNumber || '').trim();\n    if (canonicalOldNumber) {\n      next.oldSopNumber = canonicalOldNumber;\n      next.previousSopNumber = canonicalOldNumber;\n    }\n\n    const rawPreviousRevision = String(next.previousRevisionNumber || '').trim();\n    if (rawPreviousRevision) {\n      if (!/^\\d+$/.test(rawPreviousRevision)) throw new Error('INVALID_REVISION');\n      const previousRevision = rawPreviousRevision.padStart(2, '0');\n      const nextRevision = String(Number(previousRevision) + 1).padStart(2, '0');\n      next.previousRevisionNumber = previousRevision;\n      next.revisionNumber = nextRevision;\n      next.version = nextRevision;\n    }\n  }\n\n"""
          assert marker in text, 'Binary metadata marker not found'
          text = text.replace(marker, insert + marker, 1)
          policy.write_text(text)

          tests = Path('functions/sopEditContentPolicy.test.js')
          text = tests.read_text()
          old = """test('trusted edit can repair absent identity on a legacy DRAFT Riviu but cannot overwrite it later', () => {\n"""
          new = """test('trusted edit can repair and correct external legacy DRAFT Riviu identity before activation', () => {\n"""
          assert old in text, 'legacy Draft Riviu test name not found'
          text = text.replace(old, new, 1)

          old = """  const immutable = buildTrustedSopContentUpdate({\n    stored: repaired,\n    submitted: { ...repaired, oldSopNumber: 'MUTATED', previousRevisionNumber: '99', revisionNumber: '100' },\n    actor: { role: 'user' },\n    hierarchyClaims: { hierarchyKeys: ['PEN|2.1.1'], globalHierarchyAccess: false },\n  });\n  assert.equal(immutable.oldSopNumber, submitted.oldSopNumber);\n  assert.equal(immutable.previousRevisionNumber, '01');\n  assert.equal(immutable.revisionNumber, '02');\n});\n"""
          new = """  const corrected = buildTrustedSopContentUpdate({\n    stored: repaired,\n    submitted: {\n      ...repaired,\n      oldSopNumber: 'SOEGIRI / 648 / PENUNJANG / 2024',\n      previousSopNumber: 'SOEGIRI / 648 / PENUNJANG / 2024',\n      previousRevisionNumber: '02',\n      revisionNumber: '99',\n      version: '99',\n    },\n    actor: { role: 'user' },\n    hierarchyClaims: { hierarchyKeys: ['PEN|2.1.1'], globalHierarchyAccess: false },\n  });\n  assert.equal(corrected.oldSopNumber, 'SOEGIRI / 648 / PENUNJANG / 2024');\n  assert.equal(corrected.previousSopNumber, corrected.oldSopNumber);\n  assert.equal(corrected.previousRevisionNumber, '02');\n  assert.equal(corrected.revisionNumber, '03');\n  assert.equal(corrected.version, '03');\n});\n"""
          assert old in text, 'legacy Draft Riviu test assertions not found'
          text = text.replace(old, new, 1)
          tests.write_text(text)
          PY

      - name: Verify targeted policy test
        run: node --test functions/sopEditContentPolicy.test.js

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-riviu-draft-unlock.yml
          git add src/components/EditSopModal.tsx src/components/SopDetailModal.tsx functions/sopEditContentPolicy.js functions/sopEditContentPolicy.test.js
          git commit -m "fix: unlock legacy Riviu metadata while Draft"
          git push origin HEAD:main
