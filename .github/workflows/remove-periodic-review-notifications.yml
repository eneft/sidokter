name: Remove Periodic SPO Review Notifications

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-periodic-review-notifications.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Patch notification and message system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit(f'{label}: marker not found')

          def remove_between(text, start, end, label, replacement=''):
              require(text, start, label + ' start')
              start_index = text.index(start)
              try:
                  end_index = text.index(end, start_index + len(start))
              except ValueError:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:start_index] + replacement + text[end_index:]

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          require(app, '  scanDocumentsForPeriodicReviews, ', 'App periodic scan import')
          require(app, '  evaluatePeriodicReview,', 'App periodic evaluator import')
          app = app.replace('  scanDocumentsForPeriodicReviews, \n', '', 1)
          app = app.replace('  evaluatePeriodicReview,\n', '', 1)
          app = app.replace('// Real-time document assignment & review watcher', '// Real-time document workflow watcher', 1)
          app = app.replace('// Periodic review and proposal scanning on session start / data load', '// Activation and proposal scanning on session start / data load', 1)
          app = remove_between(app, '      scanDocumentsForPeriodicReviews(\n', '      scanDocumentsForActivations(\n', 'App periodic session scan')
          app = remove_between(app, '\n    const reviewStatus = evaluatePeriodicReview(finalUpdatedSop);\n', '\n  };\n\n  const handleReviewWorkflow', 'App periodic edit dispatch')
          app_path.write_text(app)

          notif_path = Path('src/lib/notificationService.ts')
          notif = notif_path.read_text()
          old_header = ' * untuk penugasan dokumen ke divisi, pengingat riviu berkala,\n * aktivasi SPO oleh Admin bagi User, dan usulan aktivasi bagi Admin.\n'
          new_header = ' * untuk penugasan dokumen ke divisi, aktivasi SPO oleh Admin bagi User,\n * usulan aktivasi bagi Admin, dan pesan alur perbaikan/verifikasi SPO.\n'
          require(notif, old_header, 'notification header')
          notif = notif.replace(old_header, new_header, 1)
          old_docs = ' * Initializes real-time listener for document assignments, periodic reviews,\n * admin activation alerts for users in that hierarchy, and user proposals for admin.\n'
          new_docs = ' * Initializes real-time listener for document assignments, admin activation alerts\n * for users in that hierarchy, and user proposals for admin.\n'
          require(notif, old_docs, 'notification watcher docs')
          notif = notif.replace(old_docs, new_docs, 1)
          notif = remove_between(notif, '\n          // EVENT 4: PERIODIC REVIEW ALERT\n', '\n        });\n      },\n', 'realtime periodic review producer')
          local_replacement = '\n    // Legacy client periodic-review events are intentionally ignored. Human\n    // correction/review messages are created authoritatively by sopReviewWorkflow.\n    if (type === \'review\') return;\n'
          notif = remove_between(notif, '\n    if (type === \'review\') {\n', '\n  };\n\n  const handleBroadcastMessage', 'local periodic review producer', local_replacement)
          scan_marker = '/**\n * Evaluates all existing documents in memory on login/session mount and alerts if any\n * document assigned to user\'s division requires periodic review.\n */\nexport function scanDocumentsForPeriodicReviews('
          require(notif, scan_marker, 'periodic scan compatibility function')
          scan_index = notif.index(scan_marker)
          compat = "/**\n * Backward-compatible no-op. Automatic periodic/annual SPO review reminders were\n * retired from Pesan; review dates may still exist as document metadata.\n */\nexport function scanDocumentsForPeriodicReviews(\n  _sops: SopDocument[],\n  _userSession: UserSession | null,\n  _onToast: RealtimeWatcherOptions['onToast'],\n  _onSelectDocument?: (doc: SopDocument) => void\n): void {\n  return;\n}\n"
          notif = notif[:scan_index] + compat
          notif_path.write_text(notif)

          mailbox_path = Path('src/lib/mailboxPolicy.ts')
          mailbox = mailbox_path.read_text()
          marker = 'export function isInternalMailItem(item: MailboxCandidate): boolean {\n  if (!item || typeof item.id !== \'string\' || !item.id.trim()) return false;\n'
          require(mailbox, marker, 'mailbox admission function')
          helper = "\n/** Legacy automatic periodic/annual SPO review reminders are no longer mailbox items. */\nexport function isPeriodicReviewReminder(item: MailboxCandidate): boolean {\n  const eventKey = String(item?.metadata?.eventKey || item?.id || '').trim().toLowerCase();\n  const title = String(item?.title || '').trim().toLowerCase();\n  return eventKey.startsWith('review:') || title === 'perlu riviu berkala';\n}\n"
          interface_end = '}\n\n/**\n * Unified mailbox admission policy.'
          require(mailbox, interface_end, 'mailbox helper insertion point')
          mailbox = mailbox.replace(interface_end, '}' + helper + '\n/**\n * Unified mailbox admission policy.', 1)
          mailbox = mailbox.replace(marker, marker + '  if (isPeriodicReviewReminder(item)) return false;\n', 1)
          mailbox_path.write_text(mailbox)

          test_path = Path('tests/mailbox-filter.test.ts')
          test_text = test_path.read_text()
          if 'automatic periodic SPO review reminders are excluded' not in test_text:
              test_text += "\n\ntest('automatic periodic SPO review reminders are excluded but human correction mail remains visible', () => {\n  assert.equal(isVisibleMailboxItem(workflow('review', {\n    title: 'Perlu Riviu Berkala',\n    metadata: { eventKey: 'review:spo-1:2026-12-31' }\n  })), false);\n  assert.equal(isVisibleMailboxItem(workflow('review', {\n    title: 'Perlu Perbaikan SPO',\n    metadata: { eventKey: 'sop-revision-requested-spo-1-1', mailKind: 'human', senderUid: 'reviewer' }\n  })), true);\n});\n"
          test_path.write_text(test_text)

          source_test_path = Path('tests/periodic-review-notification-disabled.test.cjs')
          source_test_path.write_text("const test = require('node:test');\nconst assert = require('node:assert/strict');\nconst fs = require('node:fs');\n\nconst app = fs.readFileSync('src/App.tsx', 'utf8');\nconst service = fs.readFileSync('src/lib/notificationService.ts', 'utf8');\n\ntest('automatic periodic review notification producers are disabled', () => {\n  assert.equal(app.includes('scanDocumentsForPeriodicReviews('), false);\n  assert.equal(app.includes(\"dispatchDocumentEvent('review'\"), false);\n  assert.equal(service.includes('EVENT 4: PERIODIC REVIEW ALERT'), false);\n  assert.equal(service.includes(\"title: 'Perlu Riviu Berkala'\"), false);\n});\n\ntest('legacy periodic review client events are ignored', () => {\n  assert.equal(service.includes(\"if (type === 'review') return;\"), true);\n});\n")

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['scripts']['test:mail'] = 'node --test functions/internalMailPolicy.test.js tests/internal-mail-ui.test.cjs tests/periodic-review-notification-disabled.test.cjs && tsx --test tests/mailbox-filter.test.ts'
          pkg_path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify notification and mail tests
        run: npm run test:mail

      - name: Verify client build
        run: npm run build:client

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/lib/notificationService.ts src/lib/mailboxPolicy.ts tests/mailbox-filter.test.ts tests/periodic-review-notification-disabled.test.cjs package.json
          git commit -m "fix: remove automatic periodic SPO review notifications"
          git push
