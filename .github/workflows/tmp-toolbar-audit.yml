name: Temporary Live SPO Toolbar Browser Audit

on:
  push:
    branches:
      - fix/live-spo-toolbar-command-bridge-v3

permissions:
  contents: read

jobs:
  audit-toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Write browser fixture
        shell: bash
        run: |
          cat > toolbar-audit.html <<'EOF'
          <!doctype html><html><head><meta charset="UTF-8"><title>Toolbar Audit</title></head><body><div id="root"></div><script type="module" src="/toolbar-audit.tsx"></script></body></html>
          EOF
          cat > toolbar-audit.tsx <<'EOF'
          import React, { useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import './src/index.css';
          import { SopLiveTemplate } from './src/components/SopLiveTemplate';
          declare global { interface Window { __auditState?: any } }
          const longProcedure = [
            '<p><strong>Persiapan petugas :</strong></p>',
            ...Array.from({ length: 55 }, (_, i) => `<p>${i + 1}. Langkah prosedur audit toolbar nomor ${i + 1} dengan isi cukup panjang agar section PROSEDUR terbagi ke beberapa halaman A4 untuk reproduksi editor existing multi-page.</p>`)
          ].join('');
          function App() {
            const [title, setTitle] = useState('AUDIT TOOLBAR LIVE SPO');
            const [effectiveDate, setEffectiveDate] = useState('2026-09-22');
            const [pengertian, setPengertian] = useState('<p>Pengertian audit.</p>');
            const [tujuan, setTujuan] = useState('<p>Tujuan audit.</p>');
            const [kebijakan, setKebijakan] = useState('<p>Kebijakan audit.</p>');
            const [prosedur, setProsedur] = useState(longProcedure);
            const [alur, setAlur] = useState('<p>Alur audit.</p>');
            const [unitTerkait, setUnitTerkait] = useState('<p>Unit audit.</p>');
            window.__auditState = { title, effectiveDate, pengertian, tujuan, kebijakan, prosedur, alur, unitTerkait };
            return <SopLiveTemplate title={title} onTitleChange={setTitle} sopNumber="PEN / 1.2.1.2 / 999 / 2026" version="00" effectiveDate={effectiveDate} onEffectiveDateChange={setEffectiveDate} approverName="DIREKTUR AUDIT" pengertian={pengertian} onPengertianChange={setPengertian} tujuan={tujuan} onTujuanChange={setTujuan} kebijakan={kebijakan} onKebijakanChange={setKebijakan} prosedur={prosedur} onProsedurChange={setProsedur} alur={alur} onAlurChange={setAlur} unitTerkait={unitTerkait} onUnitTerkaitChange={setUnitTerkait} showPageHint={true} />;
          }
          createRoot(document.getElementById('root')!).render(<App />);
          EOF
      - name: Create image fixture
        run: printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9S8AAAAASUVORK5CYII=' | base64 -d > /tmp/toolbar-audit.png
      - name: Start Vite
        shell: bash
        run: |
          npm exec vite -- --host 127.0.0.1 --port 4177 > /tmp/vite-toolbar.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4177/toolbar-audit.html >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/vite-toolbar.log
          exit 1
      - name: Audit isolated toolbar interactions in Chromium
        run: node scripts/tmp-toolbar-browser-audit.mjs
      - name: Audit pagination object integrity
        if: always()
        run: node scripts/tmp-toolbar-integrity-audit.mjs
      - name: Audit extended toolbar commands in Chromium
        if: always()
        run: node scripts/tmp-toolbar-extended-audit.mjs
      - name: Diagnose remaining image context
        if: always()
        run: node scripts/tmp-image-context-debug.mjs
      - name: Live editor regression contract
        if: always()
        run: npx tsx --test tests/live-editor-toolbar-regression.test.ts
      - name: TypeScript gate
        if: always()
        run: npm run lint
      - name: Functions verification gate
        if: always()
        run: npm run verify:functions
      - name: Storage tests
        if: always()
        run: npm run test:storage
      - name: Revision tests
        if: always()
        run: npm run test:revision
      - name: SOP edit tests
        if: always()
        run: npm run test:sop-edit
      - name: SOP review tests
        if: always()
        run: npm run test:sop-review
      - name: Mail tests
        if: always()
        run: npm run test:mail
      - name: Structured table tests
        if: always()
        run: npm run test:tables
      - name: PDF binary tests
        if: always()
        run: npm run test:pdf-binary
      - name: Numbering lifecycle tests
        if: always()
        run: npm run test:numbering-lifecycle
      - name: Live pagination tests
        if: always()
        run: npm run test:live-pagination
      - name: Production build
        if: always()
        run: npm run build
