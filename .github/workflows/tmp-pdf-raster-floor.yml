name: Temporary PDF Continuation Raster Floor Verification

on:
  push:
    branches:
      - fix/pdf-continuation-raster-floor

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fail-closed PDF raster patch
        run: python3 .github/tmp-patch-pdf-raster-floor.py

      - name: Audit patch scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed source files:\n%s\n' "${changed[*]}"
          expected=("api/pdf.ts" "functions/index.js" "tests/pdf-binary-download.test.ts")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            echo "Unexpected diff scope"
            git diff --stat
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Chromium raster floor regression
        run: node .github/tmp-pdf-raster-floor.mjs

      - name: PDF binary regression
        run: npm run test:pdf-binary

      - name: Live pagination regression
        run: npm run test:live-pagination

      - name: Toolbar regression
        run: npx tsx --test tests/live-editor-toolbar-regression.test.ts

      - name: Structured table suite
        run: npm run test:tables

      - name: Storage regression
        run: npm run test:storage

      - name: Revision regression
        run: npm run test:revision

      - name: SOP edit regression
        run: npm run test:sop-edit

      - name: SOP review regression
        run: npm run test:sop-review

      - name: Mail regression
        run: npm run test:mail

      - name: Numbering lifecycle regression
        run: npm run test:numbering-lifecycle

      - name: Verify Firebase Functions
        run: npm run verify:functions

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified patch and remove temporary files
        shell: bash
        run: |
          git rm -f .github/tmp-patch-pdf-raster-floor.py .github/tmp-pdf-raster-floor.mjs .github/workflows/tmp-pdf-raster-floor.yml .github/tmp-pdf-raster-trigger.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/pdf.ts functions/index.js tests/pdf-binary-download.test.ts
          git diff --cached --check
          git commit -m "fix: align PDF continuation raster floor"
          git push origin HEAD:fix/pdf-continuation-raster-floor
