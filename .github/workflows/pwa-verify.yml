name: Verify PWA iOS Packaging

on:
  push:
    branches: [pwa/ios-production-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Build production client
        run: npm run build:client
      - name: Verify PWA metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/manifest.webmanifest
          grep -q '"display": "standalone"' dist/manifest.webmanifest
          grep -q 'apple-mobile-web-app-capable' dist/index.html
          grep -q 'manifest.webmanifest' dist/index.html
          test -f dist/logo_soegiri_transparent.png
