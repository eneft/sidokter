name: Apply Admin Archived SPO Delete Fix

on:
  push:
    branches:
      - fix/admin-delete-archived-sop-20260925
    paths:
      - '.github/workflows/admin-archive-delete-patch.yml'
      - 'scripts/apply-archive-delete-patch.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-delete-archived-sop-20260925

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply archived SPO permanent-delete patch
        run: python scripts/apply-archive-delete-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Verify functions syntax
        run: npm run verify:functions

      - name: Run SPO delete and lifecycle regressions
        run: npm run test:sop-edit

      - name: Run numbering lifecycle regressions
        run: npm run test:numbering-lifecycle

      - name: Run A4 and table regressions
        run: npm run test:tables

      - name: Build web client
        run: npm run build:client

      - name: Verify destructive-action contract
        shell: bash
        run: |
          grep -q "PERMANENT_ARCHIVE_DELETE" src/lib/firestoreService.ts
          grep -q "SOP_ARCHIVE_DELETED" functions/index.js
          grep -q "referencesPreserved: true" functions/index.js
          grep -q "numberRecycled: false" functions/index.js
          grep -q "findArchivedSopRelations" src/App.tsx
          grep -q "Tetap Hapus Arsip" src/components/DeleteConfirmModal.tsx

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/admin-archive-delete-patch.yml scripts/apply-archive-delete-patch.py
          git add src/App.tsx src/components/DeleteConfirmModal.tsx src/lib/sopService.ts src/lib/firestoreService.ts src/utils/sopArchiveRelations.ts functions/index.js functions/sopDeletePolicy.js functions/sopDeletePolicy.test.js tests/sop-archive-relations.test.ts tests/sop-archive-delete-boundary.test.cjs package.json
          git commit -m 'feat: allow admin to permanently delete archived SPOs safely'
          git push origin HEAD:fix/admin-delete-archived-sop-20260925
