name: Fix stale USED sync

on:
  push:
    branches:
      - fix/sop-number-sync-apply-stale-used

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sop-number-sync-apply-stale-used
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply client patch
        run: node scripts/patch-stale-used-sync.cjs

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Verify Functions
        run: npm run verify:functions

      - name: Test number synchronization
        run: npm run test:numbering-lifecycle

      - name: Test trusted SPO edit boundary
        run: npm run test:sop-edit

      - name: Build client
        run: npm run build:client

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/numbering.ts src/lib/firestoreService.ts src/App.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: make number sync apply stale USED gaps"
            git push origin HEAD:fix/sop-number-sync-apply-stale-used
          fi
