name: Temporary Trusted SPO Edit Apply

on:
  push:
    branches:
      - fix/sop-edit-trusted-session-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sop-edit-trusted-session-boundary
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply candidate fail-closed
        run: python3 scripts/tmp-apply-sop-edit-trusted.py

      - name: Audit intended source scope before tests
        run: |
          git diff --name-only HEAD -- \
            functions/index.js \
            src/lib/firestoreService.ts \
            src/lib/sopService.ts \
            package.json
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "functions/index.js package.json src/lib/firestoreService.ts src/lib/sopService.ts "

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Trusted edit regressions
        run: npm run test:sop-edit

      - name: Verify Functions
        run: npm run verify:functions

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build:client

      - name: Commit validated candidate and remove temporary audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js src/lib/firestoreService.ts src/lib/sopService.ts package.json functions/sopEditContentPolicy.js functions/sopEditContentPolicy.test.js tests/sop-edit-trusted-boundary.test.cjs
          git rm scripts/tmp-apply-sop-edit-trusted.py .github/workflows/tmp-apply-sop-edit-trusted.yml
          git commit -m "Fix SPO edit permission through trusted session boundary"
          git push origin HEAD:fix/sop-edit-trusted-session-boundary
