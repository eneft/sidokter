name: One-time login logo integration

on:
  push:
    branches:
      - fix/login-brand-logo

permissions:
  contents: write

jobs:
  patch-login-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/login-brand-logo
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded login logo patch
        run: python scripts/one-time-login-logo.py

      - name: Verify logo asset exists
        run: test -s public/sidokter-logo.webp

      - name: Install dependencies
        run: npm ci

      - name: Build web client
        run: npm run build:client

      - name: Commit patched login
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Use SIDOKTER logo on login page"
            git push origin HEAD:fix/login-brand-logo
          fi
